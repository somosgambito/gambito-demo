<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>gamb1t0_ · trabajos</title>
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#07070f;color:#dddaf0;font-family:'Fira Code','Courier New',monospace;overflow-x:hidden;}
.energia-bar-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:20;padding:0 16px;pointer-events:none;}
.energia-bar-inner{height:3px;width:100%;background:rgba(255,255,255,.06);}
.energia-bar-fill{height:100%;transition:width .8s,background .5s;}
.energia-label{position:fixed;top:4px;right:20px;font-size:9px;letter-spacing:.06em;z-index:21;font-family:'Fira Code',monospace;}
.page{width:100%;max-width:440px;margin:0 auto;padding-bottom:80px;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:.5px solid rgba(221,218,240,.08);position:sticky;top:0;background:#07070f;z-index:10;}
.back-btn{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);padding:4px 8px 4px 0;}
.back-btn:hover{color:#c9a84c;}
.top-title{font-size:15px;font-weight:700;}
.top-right{margin-left:auto;display:flex;gap:10px;font-size:11px;}
.top-stat{color:rgba(221,218,240,.4);}
.top-stat span{font-weight:700;color:#c9a84c;}
.content{padding:16px;}
.sec-label{font-size:10px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}

/* TRABAJO ACTIVO */
.trabajo-activo-card{background:rgba(0,200,150,.06);border:.5px solid rgba(0,200,150,.3);border-radius:12px;padding:16px;margin-bottom:16px;}
.ta-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ta-badge{font-size:9px;color:#07070f;background:#00c896;border-radius:10px;padding:2px 8px;margin-left:4px;}
.ta-prog-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.ta-prog-fill{height:100%;background:#00c896;border-radius:3px;}
.ta-meta{font-size:11px;color:rgba(221,218,240,.35);margin-top:4px;}
.ta-btns{display:flex;gap:8px;margin-top:12px;}
.btn-ta{flex:1;font-family:'Fira Code',monospace;font-size:11px;padding:8px;border-radius:6px;cursor:pointer;}
.btn-avisar{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.25);}
.btn-desertar{background:rgba(255,77,109,.08);color:#ff4d6d;border:.5px solid rgba(255,77,109,.2);}
.btn-tareas{background:rgba(0,200,150,.1);color:#00c896;border:.5px solid rgba(0,200,150,.25);}

/* TRABAJO CARD */
.trabajo-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:16px;margin-bottom:10px;position:relative;transition:all .2s;}
.trabajo-card.disponible{cursor:pointer;}
.trabajo-card.disponible:hover{border-color:rgba(201,168,76,.3);transform:translateY(-1px);}
.trabajo-card.bloqueado{opacity:.5;}
.tc-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.tc-entrevistador{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(221,218,240,.15);flex-shrink:0;}
.tc-name{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:2px;}
.tc-entrev-nombre{font-size:10px;color:rgba(221,218,240,.35);margin-bottom:4px;}
.tc-desc{font-size:11px;color:rgba(221,218,240,.4);line-height:1.5;}
.tc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tc-badge{font-size:10px;padding:3px 8px;border-radius:4px;}
.b-dias{background:rgba(0,229,255,.08);color:#00e5ff;border:.5px solid rgba(0,229,255,.2);}
.b-gus{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.2);}
.b-xp{background:rgba(127,106,240,.1);color:#7f6af0;border:.5px solid rgba(127,106,240,.2);}
.b-nivel{background:rgba(255,255,255,.04);color:rgba(221,218,240,.45);border:.5px solid rgba(221,218,240,.1);}
.b-tokens{background:rgba(0,229,255,.06);color:#00e5ff;border:.5px solid rgba(0,229,255,.15);}
.tc-cupos{font-size:10px;color:rgba(221,218,240,.3);margin-bottom:6px;}
.cupos-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-top:3px;}
.cupos-fill{height:100%;background:#ff4d6d;border-radius:2px;}
.tc-protegido{font-size:10px;color:#00c896;}
.tc-bloqueo-msg{font-size:11px;color:#ff4d6d;margin-top:6px;font-weight:700;}

/* ENTREVISTA OVERLAY */
#entrevista-overlay{position:fixed;inset:0;background:#07070f;z-index:300;display:none;flex-direction:column;overflow-y:auto;}
#entrevista-overlay.show{display:flex;}
.ent-wrap{width:100%;max-width:440px;margin:0 auto;padding:20px 20px 80px;}
.ent-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.ent-back{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);}
.ent-title{font-size:15px;font-weight:700;}
.ent-perfil{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:14px;margin-bottom:20px;}
.ent-av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,168,76,.3);flex-shrink:0;}
.ent-nombre{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:2px;}
.ent-cargo{font-size:11px;color:#c9a84c;margin-bottom:2px;}
.ent-empresa{font-size:10px;color:rgba(221,218,240,.35);}
.ent-personalidad{font-size:10px;color:rgba(221,218,240,.25);font-style:italic;margin-top:4px;}
.gi-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;}
.gi-av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(0,229,255,.3);flex-shrink:0;background:rgba(0,229,255,.1);}
.gi-bubble{background:rgba(0,229,255,.06);border:.5px solid rgba(0,229,255,.15);border-radius:0 10px 10px 10px;padding:11px 14px;font-size:13px;color:#dddaf0;line-height:1.6;flex:1;}

/* PREGUNTAS */
.preg-progreso{display:flex;gap:4px;margin-bottom:14px;}
.preg-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s;}
.preg-dot.done{background:#c9a84c;}
.preg-dot.active{background:rgba(201,168,76,.5);}
.preg-num{font-size:9px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.preg-txt{font-size:14px;color:#dddaf0;line-height:1.55;margin-bottom:14px;font-weight:700;}
.preg-opts{display:flex;flex-direction:column;gap:8px;}
.preg-opt{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.1);border-radius:8px;padding:13px 14px;cursor:pointer;font-size:13px;color:rgba(221,218,240,.6);transition:all .2s;line-height:1.4;}
.preg-opt:hover{border-color:rgba(201,168,76,.3);color:#dddaf0;}
.preg-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.08);color:#dddaf0;}
.btn-siguiente{width:100%;background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:14px;cursor:pointer;margin-top:12px;}
.btn-siguiente:disabled{opacity:.3;cursor:not-allowed;}

/* SUSPENSE — entrevistador escribiendo */
#suspense-overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;}
#suspense-overlay.show{display:flex;}
.susp-av{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,168,76,.4);margin-bottom:16px;}
.susp-nombre{font-size:13px;color:#c9a84c;margin-bottom:16px;}
.susp-carta{background:rgba(255,255,255,.05);border:.5px solid rgba(221,218,240,.15);border-radius:12px;padding:20px;width:100%;max-width:320px;margin-bottom:20px;min-height:120px;}
.susp-texto{font-size:13px;color:rgba(221,218,240,.8);line-height:1.8;font-style:italic;}
.susp-cursor{display:inline-block;width:2px;height:14px;background:#c9a84c;margin-left:2px;vertical-align:middle;animation:cursorBlink .7s step-start infinite;}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
.susp-dots{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.susp-dot{width:8px;height:8px;border-radius:50%;background:rgba(201,168,76,.3);animation:dotPulse 1.2s ease-in-out infinite;}
.susp-dot:nth-child(2){animation-delay:.2s;}
.susp-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* RESULTADO */
#ent-resultado{display:none;text-align:center;padding:20px 0;}
#ent-resultado.show{display:block;}
.ent-reaccion{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left;}
.ent-reac-av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,168,76,.25);flex-shrink:0;}
.ent-reac-nombre{font-size:11px;color:#c9a84c;margin-bottom:6px;}
.ent-reac-txt{font-size:13px;color:rgba(221,218,240,.7);line-height:1.6;font-style:italic;}

/* REY TRÉBOLES — grande */
.rey-trebol-wrap{text-align:center;margin-bottom:20px;animation:cardIn .5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes cardIn{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rey-trebol-img{width:100%;max-width:260px;height:auto;border-radius:16px;box-shadow:0 0 40px rgba(0,200,150,.3),0 20px 60px rgba(0,0,0,.8);margin:0 auto 12px;display:block;}
.rey-trebol-txt{font-size:13px;color:rgba(221,218,240,.55);font-style:italic;line-height:1.6;padding:0 8px;}

/* LOGRO CARD */
.logro-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:16px;margin-bottom:16px;}
.logro-icon{font-size:48px;display:block;margin-bottom:10px;animation:logroFloat 2s ease-in-out infinite;}
@keyframes logroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.logro-titulo{font-size:10px;color:rgba(221,218,240,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.logro-nombre{font-size:20px;font-weight:700;margin-bottom:4px;}
.logro-nombre.contratado{color:#00c896;}
.logro-nombre.rechazado{color:#ff4d6d;}
.logro-nombre.sobre{color:#c9a84c;}
.logro-sub{font-size:13px;color:rgba(221,218,240,.4);line-height:1.6;margin-bottom:12px;}
.logro-rewards{display:flex;gap:8px;justify-content:center;margin-bottom:0;}
.logro-reward{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;}
.logro-xp{background:rgba(127,106,240,.12);color:#7f6af0;border:.5px solid rgba(127,106,240,.25);}
.logro-gus{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.2);}

.btn-aceptar-trabajo{width:100%;background:#00c896;color:#07070f;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:14px;cursor:pointer;margin-bottom:10px;}
.btn-cerrar-ent{width:100%;background:rgba(255,255,255,.06);color:rgba(221,218,240,.5);font-family:'Fira Code',monospace;font-size:13px;border:.5px solid rgba(221,218,240,.12);border-radius:8px;padding:12px;cursor:pointer;}

/* PRUEBA ANTI-IA */
#prueba-overlay{position:fixed;inset:0;background:#07070f;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#prueba-overlay.show{display:flex;}
.prueba-wrap{width:100%;max-width:400px;}
.prueba-header{text-align:center;margin-bottom:20px;}
.prueba-trabajo{font-size:11px;color:rgba(221,218,240,.35);letter-spacing:.08em;margin-bottom:6px;}
.prueba-titulo{font-size:16px;font-weight:700;color:#c9a84c;margin-bottom:4px;}
.prueba-instruccion{font-size:13px;color:rgba(221,218,240,.5);line-height:1.5;}
.prueba-timer{font-size:52px;font-weight:700;color:#c9a84c;text-align:center;margin:16px 0;line-height:1;}
.prueba-timer.urgente{color:#ff4d6d;animation:timerPulse .5s step-start infinite;}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.3}}
.prueba-reto{background:rgba(255,255,255,.05);border:.5px solid rgba(221,218,240,.12);border-radius:12px;padding:16px;margin-bottom:16px;}
.prueba-reto-txt{font-size:14px;color:#dddaf0;line-height:1.6;margin-bottom:12px;font-weight:700;}
.prueba-opts{display:flex;flex-direction:column;gap:8px;}
.prueba-opt{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.1);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:13px;color:rgba(221,218,240,.6);transition:all .2s;}
.prueba-opt:hover{border-color:rgba(201,168,76,.3);color:#dddaf0;}
.prueba-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.08);color:#dddaf0;}
.btn-confirmar-prueba{width:100%;background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:14px;cursor:pointer;margin-top:8px;}
.btn-confirmar-prueba:disabled{opacity:.3;cursor:not-allowed;}
.prueba-intentos{font-size:11px;color:rgba(221,218,240,.3);text-align:center;margin-top:8px;}

/* PERIODO PRUEBA FALLIDO */
#prueba-fallida{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:600;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;}
#prueba-fallida.show{display:flex;}
.pf-av{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;border:2px solid rgba(255,77,109,.3);}
.pf-nombre{font-size:12px;color:#ff4d6d;margin-bottom:12px;}
.pf-carta{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:20px;max-width:320px;margin-bottom:20px;}
.pf-txt{font-size:13px;color:rgba(221,218,240,.7);line-height:1.8;font-style:italic;}
.btn-pf-cerrar{background:rgba(255,255,255,.06);color:rgba(221,218,240,.5);font-family:'Fira Code',monospace;font-size:13px;border:.5px solid rgba(221,218,240,.12);border-radius:8px;padding:12px 28px;cursor:pointer;}

/* TAREAS */
#tareas-overlay{position:fixed;inset:0;background:#07070f;z-index:300;display:none;flex-direction:column;overflow-y:auto;}
#tareas-overlay.show{display:flex;}
.tar-wrap{width:100%;max-width:440px;margin:0 auto;padding:20px 20px 80px;}
.tar-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.tar-back{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);}
.tar-title{font-size:15px;font-weight:700;}
.progreso-trabajo{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:10px;padding:14px;margin-bottom:14px;}
.pt-label{font-size:10px;color:rgba(221,218,240,.3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.pt-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.pt-fill{height:100%;background:#c9a84c;border-radius:3px;}
.pt-meta{font-size:11px;color:rgba(221,218,240,.35);}
.pt-gus-acum{font-size:13px;color:#c9a84c;font-weight:700;margin-top:4px;}
.tarea-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:10px;padding:14px;margin-bottom:10px;}
.tarea-num{font-size:9px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.tarea-txt{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:12px;line-height:1.5;}
.tarea-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.tarea-opt{background:rgba(255,255,255,.03);border:.5px solid rgba(221,218,240,.08);border-radius:6px;padding:10px 12px;cursor:pointer;font-size:12px;color:rgba(221,218,240,.55);transition:all .2s;}
.tarea-opt:hover{border-color:rgba(201,168,76,.3);color:#dddaf0;}
.tarea-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.06);color:#dddaf0;}
.tarea-opt.completada{border-color:rgba(0,200,150,.3);color:#00c896;background:rgba(0,200,150,.05);pointer-events:none;}
.btn-completar-tarea{background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:13px;font-weight:700;border:none;border-radius:6px;padding:10px 20px;cursor:pointer;}
.btn-completar-tarea:disabled{opacity:.3;cursor:not-allowed;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(7,7,15,.95);border-top:.5px solid rgba(221,218,240,.08);display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(16px);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 10px;border-radius:8px;background:none;border:none;font-family:'Fira Code',monospace;transition:all .2s;}
.nav-btn.active{background:rgba(201,168,76,.08);}
.nav-icon{font-size:19px;line-height:1;}
.nav-label{font-size:9px;color:rgba(221,218,240,.35);letter-spacing:.05em;text-transform:uppercase;}
.nav-btn.active .nav-label,.nav-btn.active .nav-icon{color:#c9a84c;}
</style>
</head>
<body>
<script src="gbt_core.js"></script>
<div class="energia-bar-wrap"><div class="energia-bar-inner"><div class="energia-bar-fill" id="e-bar"></div></div></div>
<div class="energia-label" id="e-label">energía</div>

<div class="page">
  <div class="topbar">
    <div class="back-btn" onclick="navTo('misiones')">←</div>
    <div class="top-title">trabajos</div>
    <div class="top-right">
      <div class="top-stat">GUS <span id="gus-disp">50</span></div>
      <div class="top-stat">nv <span id="lvl-disp">1</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- SUSPENSE -->
<div id="suspense-overlay">
  <img src="" alt="" class="susp-av" id="susp-av">
  <div class="susp-nombre" id="susp-nombre"></div>
  <div class="susp-carta">
    <div class="susp-texto" id="susp-texto"></div>
  </div>
  <div class="susp-dots"><div class="susp-dot"></div><div class="susp-dot"></div><div class="susp-dot"></div></div>
</div>

<!-- ENTREVISTA -->
<div id="entrevista-overlay">
<div class="ent-wrap">
  <div class="ent-header">
    <div class="ent-back" onclick="cerrarEntrevista()">←</div>
    <div class="ent-title" id="ent-title">entrevista</div>
  </div>
  <div class="ent-perfil" id="ent-perfil"></div>
  <div class="gi-row">
    <img src="img/gi_face.jpg" alt="gi" class="gi-av" onerror="this.style.background='rgba(0,229,255,.15)';this.removeAttribute('src')">
    <div class="gi-bubble" id="gi-intro-txt">prepárate</div>
  </div>
  <div id="ent-preguntas"></div>
  <div id="ent-resultado">
    <div class="ent-reaccion" id="ent-reaccion"></div>
    <div class="rey-trebol-wrap">
      <img src="img/rey_treboles.jpg" alt="rey de tréboles" class="rey-trebol-img" onerror="this.style.background='rgba(0,200,150,.1)';this.removeAttribute('src')">
      <div class="rey-trebol-txt" id="rey-trebol-txt"></div>
    </div>
    <div class="logro-card" id="logro-card">
      <span class="logro-icon" id="logro-icon">◈</span>
      <div class="logro-titulo">// resultado</div>
      <div class="logro-nombre" id="logro-nombre"></div>
      <div class="logro-sub" id="logro-sub"></div>
      <div class="logro-rewards" id="logro-rewards"></div>
    </div>
    <button class="btn-aceptar-trabajo" id="btn-aceptar-trabajo" onclick="iniciarPruebaAntiIA()" style="display:none">aceptar trabajo → prueba de inicio</button>
    <button class="btn-cerrar-ent" onclick="cerrarEntrevista()">volver a trabajos</button>
  </div>
</div>
</div>

<!-- PRUEBA ANTI-IA -->

function calcNivel(x){return x<200?1:x<500?2:x<1000?3:x<2000?4:x<4000?5:Math.floor(x/1000)+1;}

function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function updateUI(){
  const st=GBT.getStats();
  const nivel=calcNivel(st.xp);
  document.getElementById('gus-disp').textContent=st.gus;
  document.getElementById('lvl-disp').textContent=nivel;
  const max=GBT.energiaMax(nivel);
  const pct=Math.round(st.energia/max*100);
  const estado=GBT.estadoEnergia(st.energia,max);
  const bar=document.getElementById('e-bar'),lbl=document.getElementById('e-label');
  if(bar){bar.style.width=pct+'%';bar.style.background=estado.color;}
  if(lbl){lbl.textContent=pct+'% · '+estado.label;lbl.style.color=estado.color+'aa';}
}

      <div class="ta-prog-bar"><div class="ta-prog-fill" style="width:${pct}%"></div></div>
      <div class="ta-meta">${pct}% · ${horasR}h restantes · acumulado: ${gusAcum} GUS</div>
      <div class="ta-btns">
        <button class="btn-ta btn-tareas" onclick="abrirTareas()">tareas</button>
        <button class="btn-ta btn-avisar" onclick="abandonarConAviso()">avisar y salir</button>
        <button class="btn-ta btn-desertar" onclick="desertar()">salir sin avisar</button>
      </div>
    </div>`;
  }

  html+=`<div class="sec-label">// trabajos disponibles</div>`;
  TRABAJOS.forEach(t=>{
    const cuposPct=Math.round(t.cupos_ocupados/t.cupos_total*100);
    const lleno=t.cupos_ocupados>=t.cupos_total;
    const bloqNivel=nivel<t.nivel_min;
    const sobre=nivel>t.nivel_max&&t.nivel_max<99;
    const trabajando=trabajoActivo!==null;
    const sinEnergia=estado.label==='agotado';
    const sinTokens=st.tokens<t.costo_tokens;
    const disponible=!lleno&&!bloqNivel&&!trabajando&&!sinEnergia&&!sinTokens;
    let msg='';
    if(bloqNivel) msg=`// requiere nivel ${t.nivel_min} — estás en nivel ${nivel}`;
    else if(sobre) msg=`// tu nivel supera este trabajo — busca uno más exigente`;
    else if(lleno) msg=`// sin cupos disponibles`;
    else if(trabajando) msg=`// ya estás trabajando — termínalo primero`;
    else if(sinEnergia) msg=`// avatar agotado — descansa primero`;
    else if(sinTokens) msg=`// necesitas ${t.costo_tokens} tokens para aplicar`;
    html+=`<div class="trabajo-card ${disponible?'disponible':'bloqueado'}" onclick="${disponible?`abrirEntrevista('${t.id}')`:''}"">
      <div class="tc-top">
        <img src="${t.entrevistador.img}" class="tc-entrevistador" onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
        <div><div class="tc-name">${t.icon} ${t.name}</div>
        <div class="tc-entrev-nombre">entrevista con ${t.entrevistador.nombre}</div>
        <div class="tc-desc">${t.desc}</div></div>
      </div>
      <div class="tc-badges">
        <span class="tc-badge b-dias">${t.duracion_dias}${t.duracion_dias===1?' día':' días'}</span>
        <span class="tc-badge b-gus">+${t.gus_base} GUS</span>
        <span class="tc-badge b-xp">+${t.xp_bonus} XP</span>
        <span class="tc-badge b-nivel">nv ${t.nivel_min}${t.nivel_max<99?'–'+t.nivel_max:'+'}</span>
        <span class="tc-badge b-tokens">${t.costo_tokens} tok para aplicar</span>
      </div>
      <div class="tc-cupos">${t.cupos_ocupados}/${t.cupos_total} cupos
        <div class="cupos-bar"><div class="cupos-fill" style="width:${cuposPct}%"></div></div>
      </div>
      <div class="tc-protegido">✓ protegido de ataques mientras trabajas</div>
      ${msg?`<div class="tc-bloqueo-msg">${msg}</div>`:''}
    </div>`;
  });
  c.innerHTML=html;
}

// ══ ENTREVISTA ══
function abrirEntrevista(id){
  const st=GBT.getStats();
  const t=TRABAJOS.find(x=>x.id===id);
  if(!t) return;
  if(st.tokens<t.costo_tokens){ alert('necesitas '+t.costo_tokens+' tokens para aplicar'); return; }
  GBT.useTokens(t.costo_tokens);
  updateUI();
  trabajoEntrevistando=t;
  respuestasEnt={}; pregActual=0;
  // seleccionar 5 preguntas al azar del banco
  const banco=BANCO[id]||[];
  preguntasSeleccionadas=shuffle(banco).slice(0,Math.min(5,banco.length)).map(p=>({
    ...p,
    opts_shuffled: shuffle(p.opts.map((o,i)=>({o,orig:i}))),
  }));

  document.getElementById('ent-title').textContent='entrevista · '+t.name;
  const e=t.entrevistador;
  document.getElementById('ent-perfil').innerHTML=`
    <img src="${e.img}" class="ent-av" onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
    <div><div class="ent-nombre">${e.nombre}</div><div class="ent-cargo">${e.cargo}</div>
    <div class="ent-empresa">${e.empresa}</div><div class="ent-personalidad">${e.personalidad}</div></div>`;
  document.getElementById('gi-intro-txt').textContent=
    'las preguntas son distintas cada vez — no hay respuestas correctas, solo formas de ser — '+
    t.umbral+' de '+preguntasSeleccionadas.length+' respuestas deciden si '+e.nombre.split(' ')[0]+' te contrata';
  document.getElementById('ent-resultado').classList.remove('show');
  document.getElementById('ent-preguntas').style.display='block';
  renderPregunta(0);
  document.getElementById('entrevista-overlay').classList.add('show');
}

function renderPregunta(idx){
  const p=preguntasSeleccionadas[idx];
  const total=preguntasSeleccionadas.length;
  const dots=preguntasSeleccionadas.map((_,i)=>
    `<div class="preg-dot ${i<idx?'done':i===idx?'active':''}"></div>`).join('');
  document.getElementById('ent-preguntas').innerHTML=`
    <div class="preg-progreso">${dots}</div>
    <div class="preg-num">// pregunta ${idx+1} de ${total}</div>
    <div class="preg-txt">${p.txt}</div>
    <div class="preg-opts">${p.opts_shuffled.map((item,i)=>
      `<div class="preg-opt" id="opt-${i}" onclick="selOpt(${i})">${item.o}</div>`).join('')}</div>
    <button class="btn-siguiente" id="btn-sig" onclick="siguiente()" disabled>
      ${idx<total-1?'siguiente →':'ver resultado'}</button>`;
  pregActual=idx;
}

function selOpt(i){
  document.querySelectorAll('.preg-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('opt-'+i).classList.add('sel');
  document.getElementById('btn-sig').disabled=false;
  respuestasEnt[pregActual]=preguntasSeleccionadas[pregActual].opts_shuffled[i].orig;
}

function siguiente(){
  if(pregActual<preguntasSeleccionadas.length-1){ renderPregunta(pregActual+1); }
  else{ mostrarSuspense(); }
}

// ══ SUSPENSE — carta ══
function mostrarSuspense(){
  const t=trabajoEntrevistando;
  const e=t.entrevistador;
  const st=GBT.getStats();
  const nivel=calcNivel(st.xp);

  let correctas=0;
  preguntasSeleccionadas.forEach((p,i)=>{ if(respuestasEnt[i]===p.resp) correctas++; });
  const sobre=nivel>t.nivel_max&&t.nivel_max<99;
  const pctEnergia=st.energia/GBT.energiaMax(nivel);
  let prob=(correctas/preguntasSeleccionadas.length)*0.7+Math.random()*0.3;
  if(pctEnergia<0.5) prob*=0.75;
  const contratado=!sobre&&prob>=0.45;

  document.getElementById('susp-av').src=e.img;
  document.getElementById('susp-nombre').textContent=e.nombre+' está redactando su respuesta...';
  document.getElementById('entrevista-overlay').classList.remove('show');

  const avName=GBT.player().avName||'candidato';
  let cartaTemplate=sobre?e.carta_sobre:contratado?e.carta_ok:e.carta_no;
  const cartaFinal=cartaTemplate.replace('{nombre}',avName);

  const susp=document.getElementById('suspense-overlay');
  const textoEl=document.getElementById('susp-texto');
  textoEl.innerHTML='';
  susp.classList.add('show');

  // efecto de escritura
  let i=0;
  const speed=38;
  function typeChar(){
    if(i<cartaFinal.length){
      textoEl.innerHTML=cartaFinal.substring(0,i+1).replace(/\n/g,'<br>')+
        '<span class="susp-cursor"></span>';
      i++;
      setTimeout(typeChar, speed+(Math.random()*speed*.3));
    } else {
      textoEl.innerHTML=cartaFinal.replace(/\n/g,'<br>');
      setTimeout(()=>{
        susp.classList.remove('show');
        mostrarResultado(contratado,sobre,correctas,pctEnergia,nivel);
        document.getElementById('entrevista-overlay').classList.add('show');
      },1800);
    }
  }
  typeChar();
}

function mostrarResultado(contratado,sobre,correctas,pctEnergia,nivel){
  const t=trabajoEntrevistando;
  const e=t.entrevistador;
  document.getElementById('ent-preguntas').style.display='none';
  const avName=GBT.player().avName||'';

  // reacción
  let reacArr=sobre?e.reaccion_sobre:contratado?e.reaccion_ok:e.reaccion_no;
  let reacExtra=(!sobre&&pctEnergia<0.5)?(contratado?' — aunque noto que no tienes mucha energía hoy':' — y con poca energía encima, difícil convencer'):'';
  document.getElementById('ent-reaccion').innerHTML=`
    <img src="${e.img}" class="ent-reac-av" onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
    <div><div class="ent-reac-nombre">${e.nombre}</div>
    <div class="ent-reac-txt">"${reacArr[Math.floor(Math.random()*reacArr.length)]}${reacExtra}"</div></div>`;

  document.getElementById('rey-trebol-txt').textContent=contratado?t.rey_ok:t.rey_no;

  // logro
  const li=document.getElementById('logro-icon');
  const ln=document.getElementById('logro-nombre');
  const ls=document.getElementById('logro-sub');
  const lr=document.getElementById('logro-rewards');
  const btn=document.getElementById('btn-aceptar-trabajo');

  if(sobre){
    li.textContent='⭐'; ln.className='logro-nombre sobre'; ln.textContent='hay algo mejor para ti';
    ls.textContent='tu nivel supera este trabajo — busca trabajos de mayor nivel';
    lr.innerHTML=''; btn.style.display='none';
  } else if(contratado){
    li.textContent='🎉'; ln.className='logro-nombre contratado'; ln.textContent='contratado';
    ls.textContent=t.duracion_dias+' '+(t.duracion_dias===1?'día':'días')+' de trabajo — +'+t.gus_base+' GUS al terminar — protegido de ataques';
    lr.innerHTML=`<span class="logro-reward logro-xp">+${t.xp_bonus} XP</span><span class="logro-reward logro-gus">+${t.gus_base} GUS</span>`;
    btn.style.display='block';
    trabajoConfirmado=t;
  } else {
    li.textContent='💪'; ln.className='logro-nombre rechazado'; ln.textContent='no esta vez';
    ls.textContent='puedes intentarlo de nuevo — el trabajo sigue disponible';
    lr.innerHTML=''; btn.style.display='none';
  }

  document.getElementById('ent-resultado').classList.add('show');
  GBT.enviar({tipo:'entrevista',trabajo:t.id,usuario:avName,correctas,total:preguntasSeleccionadas.length,aprobado:contratado,nivel});
}

function cerrarEntrevista(){ document.getElementById('entrevista-overlay').classList.remove('show'); renderContent(); }

// ══ PRUEBA ANTI-IA ══
function iniciarPruebaAntiIA(){
  if(!trabajoConfirmado) return;
  document.getElementById('entrevista-overlay').classList.remove('show');
  pruebaIntentos=0;
  mostrarReto();
}

function mostrarReto(){
  const t=trabajoConfirmado;
  const retos=RETOS[t.id]||RETOS.analista;
  pruebaReto=retos[Math.floor(Math.random()*retos.length)];
  pruebaOptSel=null;

  document.getElementById('prueba-trabajo-label').textContent='como '+t.name+', tu primera labor será:';
  document.getElementById('prueba-instruccion').textContent='resuelve esto correctamente para iniciar el trabajo';
  document.getElementById('prueba-intentos').textContent='intento '+(pruebaIntentos+1)+' de 3';

  // opciones barajadas
  const optsShuffled=shuffle(pruebaReto.opts.map((o,i)=>({o,orig:i})));
  document.getElementById('prueba-reto-txt').textContent=pruebaReto.txt;
  document.getElementById('prueba-opts').innerHTML=optsShuffled.map((item,i)=>
    `<div class="prueba-opt" id="popt-${i}" onclick="selPruebaOpt(${i},${item.orig})">${item.o}</div>`).join('');
  document.getElementById('btn-confirmar-prueba').disabled=true;

  // timer 30 seg
  let seg=30;
  const timerEl=document.getElementById('prueba-timer');
  timerEl.textContent=seg;
  timerEl.className='prueba-timer';
  clearInterval(pruebaTimer);
  pruebaTimer=setInterval(()=>{
    seg--;
    timerEl.textContent=seg<10?'0'+seg:seg;
    if(seg<=10) timerEl.className='prueba-timer urgente';
    playTick();
    if(seg<=0){ clearInterval(pruebaTimer); fallarPrueba(); }
  },1000);

  document.getElementById('prueba-overlay').classList.add('show');
}

let pruebaOptOrigSel=null;
function selPruebaOpt(i,orig){
  document.querySelectorAll('.prueba-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('popt-'+i).classList.add('sel');
  pruebaOptOrigSel=orig;
  document.getElementById('btn-confirmar-prueba').disabled=false;
}

function confirmarPrueba(){
  clearInterval(pruebaTimer);
  if(pruebaOptOrigSel===pruebaReto.resp){
    // correcto — iniciar trabajo
    document.getElementById('prueba-overlay').classList.remove('show');
    GBT.iniciarTrabajo(trabajoConfirmado.id);
    trabajoConfirmado=null;
    renderContent();
  } else {
    fallarPrueba();
  }
}

function fallarPrueba(){
  clearInterval(pruebaTimer);
  pruebaIntentos++;
  document.getElementById('prueba-overlay').classList.remove('show');
  if(pruebaIntentos>=3){
    // 3 intentos fallidos — periodo de prueba no superado
    const t=trabajoConfirmado;
    const e=t.entrevistador;
    document.getElementById('pf-av').src=e.img;
    document.getElementById('pf-nombre').textContent=e.nombre;
    const avName=GBT.player().avName||'estimado/a';
    document.getElementById('pf-txt').innerHTML=
      `Estimado/a ${avName},<br><br>`+
      `Lamentamos comunicarle que no ha superado el periodo de prueba inicial.<br><br>`+
      `Valoramos el esfuerzo y la disposición que ha demostrado. Le invitamos a prepararse y volver en una próxima oportunidad — la puerta no se cierra definitivamente.<br><br>`+
      `Con respeto,<br>${e.nombre}<br>${e.empresa}`;
    document.getElementById('prueba-fallida').classList.add('show');
    trabajoConfirmado=null;
  } else {
    // nuevo intento con mismo trabajo
    setTimeout(()=>mostrarReto(), 500);
  }
}

function cerrarPruebaFallida(){
  document.getElementById('prueba-fallida').classList.remove('show');
  renderContent();
}

function playTick(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=600;
    g.gain.setValueAtTime(.08,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.05);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.05);
  }catch(e){}
}

// ══ TAREAS ══
function abrirTareas(){
  const ta=GBT.getTrabajoActivo();
  if(!ta) return;
  const t=TRABAJOS.find(x=>x.id===ta.id);
  const tareasComp=GBT.get('trabajo_tareas_'+ta.id,[]);
  const banco=BANCO[ta.id]||[];
  // usar preguntas guardadas o generar nuevas
  let tareasGuardadas=GBT.get('trabajo_tareas_pregs_'+ta.id,null);
  if(!tareasGuardadas){
    tareasGuardadas=shuffle(banco).slice(0,3).map(p=>({...p,opts_shuffled:shuffle(p.opts.map((o,i)=>({o,orig:i})))}));
    GBT.set('trabajo_tareas_pregs_'+ta.id,tareasGuardadas);
  }
  document.getElementById('tar-title').textContent=t.name;
  const ahora=Date.now();
  const pctT=Math.min(Math.round((ahora-ta.inicio_ts)/(ta.fin_ts-ta.inicio_ts)*100),100);
  const gusAcum=Math.round(t.gus_base*(ahora-ta.inicio_ts)/(ta.fin_ts-ta.inicio_ts)*0.9);
  document.getElementById('progreso-trabajo').innerHTML=`
    <div class="pt-label">// progreso</div>
    <div class="pt-bar"><div class="pt-fill" style="width:${pctT}%"></div></div>
    <div class="pt-meta">${pctT}% · ${tareasComp.length}/${tareasGuardadas.length} tareas</div>
    <div class="pt-gus-acum">GUS acumulados: ${gusAcum}</div>`;
  document.getElementById('tareas-lista').innerHTML=tareasGuardadas.map((tarea,i)=>{
    const done=tareasComp.includes(i);
    return `<div class="tarea-card">
      <div class="tarea-num">// tarea ${i+1}</div>
      <div class="tarea-txt">${tarea.txt}</div>
      ${done?`<div class="tarea-opts"><div class="tarea-opt completada">✓ completada</div></div>`
        :`<div class="tarea-opts" id="topts-${i}">${tarea.opts_shuffled.map((item,j)=>
          `<div class="tarea-opt" id="topt-${i}-${j}" onclick="selTareaOpt(${i},${j},${item.orig})">${item.o}</div>`).join('')}
        </div><button class="btn-completar-tarea" id="btn-t-${i}" onclick="completarTarea(${i})" disabled>completar</button>`}
    </div>`;
  }).join('');
  document.getElementById('tareas-overlay').classList.add('show');
}

function selTareaOpt(ti,j,orig){
  document.querySelectorAll(`#topts-${ti} .tarea-opt`).forEach(o=>o.classList.remove('sel'));
  document.getElementById(`topt-${ti}-${j}`).classList.add('sel');
  document.getElementById(`btn-t-${ti}`).disabled=false;
  document.getElementById(`btn-t-${ti}`).dataset.orig=orig;
}

function completarTarea(ti){
  const ta=GBT.getTrabajoActivo();
  if(!ta) return;
  const saved=GBT.get('trabajo_tareas_'+ta.id,[]);
  if(!saved.includes(ti)){ saved.push(ti); GBT.set('trabajo_tareas_'+ta.id,saved); GBT.addXP(8); }
  abrirTareas();
}

function cerrarTareas(){ document.getElementById('tareas-overlay').classList.remove('show'); }

// ══ ABANDONO ══
function abandonarConAviso(){
  if(!confirm('si avisas recibes GUS proporcional al tiempo trabajado')) return;
  const res=GBT.abandonarTrabajo(true); updateUI(); renderContent(); alert(res.msg);
}
function desertar(){
  if(!confirm('sin avisar pierdes TODO el GUS — ¿seguro?')) return;
  const res=GBT.abandonarTrabajo(false); updateUI(); renderContent(); alert(res.msg);
}

function navTo(dest){
  const routes={nodo:'p06_tablero.html',misiones:'p07_misiones.html',duelo:'p08_duelo.html',skill:'p09_skill.html',market:'p10_market.html',universo:'p11_universo.html',trabajos:'p12_trabajos.html'};
  document.body.style.transition='opacity .25s';document.body.style.opacity='0';
  setTimeout(()=>{ window.location.href=routes[dest]||'p06_tablero.html'; },260);
}
