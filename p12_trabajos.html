<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>gamb1t0_ · trabajos</title>
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#07070f;color:#dddaf0;font-family:'Fira Code','Courier New',monospace;overflow-x:hidden;}

.energia-bar-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:20;padding:0 16px;pointer-events:none;}
.energia-bar-inner{height:3px;width:100%;background:rgba(255,255,255,.06);}
.energia-bar-fill{height:100%;transition:width .8s,background .5s;}
.energia-label{position:fixed;top:4px;right:20px;font-size:9px;letter-spacing:.06em;z-index:21;font-family:'Fira Code',monospace;}

.page{width:100%;max-width:440px;margin:0 auto;padding-bottom:80px;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:.5px solid rgba(221,218,240,.08);position:sticky;top:0;background:#07070f;z-index:10;}
.back-btn{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);padding:4px 8px 4px 0;}
.back-btn:hover{color:#c9a84c;}
.top-title{font-size:15px;font-weight:700;}
.top-right{margin-left:auto;display:flex;gap:10px;font-size:11px;}
.top-stat{color:rgba(221,218,240,.4);}
.top-stat span{font-weight:700;color:#c9a84c;}
.content{padding:16px;}
.sec-label{font-size:10px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}

/* TRABAJO ACTIVO */
.ta-card{background:rgba(0,200,150,.06);border:.5px solid rgba(0,200,150,.3);border-radius:12px;padding:16px;margin-bottom:16px;}
.ta-prog-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin:8px 0 4px;}
.ta-prog-fill{height:100%;background:#00c896;border-radius:3px;}
.ta-meta{font-size:11px;color:rgba(221,218,240,.35);}
.ta-btns{display:flex;gap:8px;margin-top:12px;}
.btn-ta{flex:1;font-family:'Fira Code',monospace;font-size:11px;padding:8px;border-radius:6px;cursor:pointer;}
.btn-avisar{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.25);}
.btn-desertar{background:rgba(255,77,109,.08);color:#ff4d6d;border:.5px solid rgba(255,77,109,.2);}
.btn-tareas{background:rgba(0,200,150,.1);color:#00c896;border:.5px solid rgba(0,200,150,.25);}

/* TRABAJO CARD */
.trabajo-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:16px;margin-bottom:10px;transition:all .2s;}
.trabajo-card.disponible{cursor:pointer;}
.trabajo-card.disponible:hover{border-color:rgba(201,168,76,.3);transform:translateY(-1px);}
.trabajo-card.bloqueado{opacity:.5;}
.tc-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.tc-av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(221,218,240,.15);flex-shrink:0;}
.tc-name{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:2px;}
.tc-sub{font-size:10px;color:rgba(221,218,240,.35);margin-bottom:4px;}
.tc-desc{font-size:11px;color:rgba(221,218,240,.4);line-height:1.5;}
.tc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tc-badge{font-size:10px;padding:3px 8px;border-radius:4px;}
.b-dias{background:rgba(0,229,255,.08);color:#00e5ff;border:.5px solid rgba(0,229,255,.2);}
.b-gus{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.2);}
.b-xp{background:rgba(127,106,240,.1);color:#7f6af0;border:.5px solid rgba(127,106,240,.2);}
.b-nivel{background:rgba(255,255,255,.04);color:rgba(221,218,240,.45);border:.5px solid rgba(221,218,240,.1);}
.b-tok{background:rgba(0,229,255,.06);color:#00e5ff;border:.5px solid rgba(0,229,255,.15);}
.tc-cupos{font-size:10px;color:rgba(221,218,240,.3);margin-bottom:6px;}
.cupos-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-top:3px;}
.cupos-fill{height:100%;background:#ff4d6d;border-radius:2px;}
.tc-prot{font-size:10px;color:#00c896;}
.tc-bloqueo{font-size:11px;color:#ff4d6d;margin-top:6px;font-weight:700;}

/* ══ VIDEOLLAMADA OVERLAY ══ */
#videollamada{
  position:fixed;inset:0;z-index:400;display:none;
  flex-direction:column;background:#000;
}
#videollamada.show{display:flex;}

/* fondo del entrevistador — ocupa toda la pantalla */
.vl-bg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0a0a1a 0%,#070710 100%);
  overflow:hidden;
}
.vl-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.35;filter:blur(8px) saturate(.5);
}
.vl-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);}

/* imagen entrevistador centrada grande */
.vl-av-wrap{
  position:absolute;inset:0;
  width:100%;height:100%;
}
.vl-av{
  width:100%;height:100%;border-radius:0;object-fit:cover;
  border:none;
  box-shadow:none;
  display:block;
}
.vl-av.speaking{
  filter:brightness(1.05);
}

/* info entrevistador abajo */
.vl-info{
  position:absolute;bottom:0;left:0;right:0;
  padding:20px 20px 32px;
  background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,transparent 100%);
}
.vl-nombre{font-size:18px;font-weight:700;color:#fff;margin-bottom:2px;}
.vl-cargo{font-size:12px;color:rgba(255,255,255,.5);}
.vl-estado{font-size:11px;color:#00e5ff;margin-top:4px;display:flex;align-items:center;gap:6px;}
.vl-dot{width:7px;height:7px;border-radius:50%;background:#00e5ff;animation:dotPulse 1.2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* GI burbuja en videollamada */
.vl-gi{
  position:absolute;top:16px;left:16px;right:16px;
  display:flex;gap:10px;align-items:flex-start;
  z-index:5;
}
.vl-gi-av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(0,229,255,.5);flex-shrink:0;}
.vl-gi-bubble{background:rgba(7,7,15,.85);border:.5px solid rgba(0,229,255,.25);border-radius:0 10px 10px 10px;padding:10px 13px;font-size:13px;color:#dddaf0;line-height:1.5;backdrop-filter:blur(8px);}

/* controles videollamada */
.vl-controls{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  display:flex;gap:16px;z-index:5;
}
.vl-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s;}
.vl-btn-end{background:#ff4d6d;}
.vl-btn-end:hover{background:#e03558;}

/* PREGUNTAS dentro de videollamada */
.vl-preguntas{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(7,7,15,.95);
  border-top:.5px solid rgba(221,218,240,.1);
  padding:16px;
  max-height:65vh;
  overflow-y:auto;
  backdrop-filter:blur(12px);
}
.preg-progreso{display:flex;gap:4px;margin-bottom:12px;}
.preg-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .3s;}
.preg-dot.done{background:#c9a84c;}
.preg-dot.active{background:rgba(201,168,76,.5);}
.preg-num{font-size:9px;color:rgba(221,218,240,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.preg-txt{font-size:13px;color:#dddaf0;line-height:1.5;margin-bottom:12px;font-weight:700;}
.preg-opts{display:flex;flex-direction:column;gap:7px;}
.preg-opt{background:rgba(255,255,255,.06);border:.5px solid rgba(221,218,240,.1);border-radius:8px;padding:11px 13px;cursor:pointer;font-size:12px;color:rgba(221,218,240,.6);transition:all .2s;}
.preg-opt:hover{border-color:rgba(201,168,41,.3);color:#dddaf0;}
.preg-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.08);color:#dddaf0;}
.btn-sig{width:100%;background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:14px;font-weight:700;border:none;border-radius:8px;padding:13px;cursor:pointer;margin-top:10px;}
.btn-sig:disabled{opacity:.3;cursor:not-allowed;}

/* ══ PROCESANDO ══ */
.vl-procesando{
  position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:10;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.vl-procesando.show{display:flex;}
.proc-txt{font-size:16px;color:#c9a84c;letter-spacing:.12em;margin-bottom:16px;}
.proc-bar{width:200px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.proc-fill{height:100%;background:#c9a84c;width:0;animation:procAnim 2.5s ease-in-out forwards;}
@keyframes procAnim{0%{width:0}70%{width:85%}100%{width:100%}}

/* ══ CARTA ══ */
.vl-carta{
  position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:11;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;backdrop-filter:blur(4px);
}
.vl-carta.show{display:flex;}
.carta-av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,168,76,.4);margin-bottom:12px;}
.carta-nombre{font-size:12px;color:#c9a84c;margin-bottom:16px;}
.carta-papel{background:rgba(255,255,255,.06);border:.5px solid rgba(221,218,240,.15);border-radius:12px;padding:20px;width:100%;max-width:320px;min-height:150px;margin-bottom:20px;}
.carta-txt{font-size:13px;color:rgba(221,218,240,.85);line-height:1.9;font-style:italic;}
.cursor-carta{display:inline-block;width:2px;height:14px;background:#c9a84c;margin-left:2px;vertical-align:middle;animation:cblink .7s step-start infinite;}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}
.btn-carta-ok{background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:14px;font-weight:700;border:none;border-radius:8px;padding:13px 32px;cursor:pointer;margin-bottom:10px;width:100%;max-width:280px;}
.btn-carta-volver{background:rgba(255,255,255,.06);color:rgba(221,218,240,.5);font-family:'Fira Code',monospace;font-size:12px;border:.5px solid rgba(221,218,240,.12);border-radius:8px;padding:11px 28px;cursor:pointer;width:100%;max-width:280px;}

/* ══ LOGRO ══ */
#logro-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:600;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;
}
#logro-overlay.show{display:flex;animation:logroIn .5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes logroIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.logro-emoji{font-size:80px;margin-bottom:16px;animation:floatEmoji 2s ease-in-out infinite;}
@keyframes floatEmoji{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logro-titulo-lbl{font-size:10px;color:rgba(221,218,240,.3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
.logro-nombre-big{font-size:24px;font-weight:700;color:#00c896;margin-bottom:6px;text-align:center;}
.logro-sub-txt{font-size:13px;color:rgba(221,218,240,.4);margin-bottom:20px;text-align:center;line-height:1.6;}
.logro-rewards{display:flex;gap:10px;margin-bottom:24px;}
.lr-xp{padding:8px 18px;background:rgba(127,106,240,.12);color:#7f6af0;border:.5px solid rgba(127,106,240,.25);border-radius:8px;font-size:13px;font-weight:700;}
.lr-gus{padding:8px 18px;background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.2);border-radius:8px;font-size:13px;font-weight:700;}
.btn-logro-sig{background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:14px;font-weight:700;border:none;border-radius:8px;padding:14px 32px;cursor:pointer;}

/* ══ REY TRÉBOLES ══ */
#rey-trebol-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:700;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;
}
#rey-trebol-overlay.show{display:flex;}
.rt-img{width:100%;max-width:280px;height:auto;border-radius:16px;box-shadow:0 0 40px rgba(0,200,150,.3),0 20px 60px rgba(0,0,0,.9);margin-bottom:20px;animation:rtIn .6s cubic-bezier(.175,.885,.32,1.275);}
@keyframes rtIn{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rt-quote{font-size:14px;color:rgba(221,218,240,.6);font-style:italic;line-height:1.7;text-align:center;max-width:280px;margin-bottom:24px;}
.btn-rt{background:rgba(255,255,255,.08);color:#dddaf0;font-family:'Fira Code',monospace;font-size:13px;border:.5px solid rgba(221,218,240,.15);border-radius:8px;padding:12px 28px;cursor:pointer;}

/* ══ PRUEBA ANTI-IA ══ */
#prueba-overlay{
  position:fixed;inset:0;background:#07070f;z-index:500;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
#prueba-overlay.show{display:flex;}
.prueba-wrap{width:100%;max-width:400px;}
.prueba-label{font-size:10px;color:rgba(221,218,240,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;text-align:center;}
.prueba-titulo{font-size:15px;font-weight:700;color:#c9a84c;margin-bottom:16px;text-align:center;line-height:1.5;}
.prueba-timer{font-size:56px;font-weight:700;color:#c9a84c;text-align:center;margin-bottom:16px;line-height:1;}
.prueba-timer.urgente{color:#ff4d6d;animation:tpulse .5s step-start infinite;}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.3}}
.prueba-reto{background:rgba(255,255,255,.05);border:.5px solid rgba(221,218,240,.12);border-radius:12px;padding:16px;margin-bottom:14px;}
.prueba-reto-txt{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:14px;line-height:1.5;}
.prueba-opts{display:flex;flex-direction:column;gap:8px;}
.prueba-opt{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.1);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:13px;color:rgba(221,218,240,.6);transition:all .2s;}
.prueba-opt:hover{border-color:rgba(201,168,76,.3);color:#dddaf0;}
.prueba-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.08);color:#dddaf0;}
.btn-confirmar{width:100%;background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:14px;cursor:pointer;margin-top:8px;}
.btn-confirmar:disabled{opacity:.3;cursor:not-allowed;}
.prueba-intentos{font-size:11px;color:rgba(221,218,240,.3);text-align:center;margin-top:8px;}

/* ══ DESPIDO VIDEO ══ */
#despido-overlay{
  position:fixed;inset:0;z-index:800;display:none;
  flex-direction:column;background:#000;
}
#despido-overlay.show{display:flex;}

/* TAREAS */
#tareas-overlay{position:fixed;inset:0;background:#07070f;z-index:300;display:none;flex-direction:column;overflow-y:auto;}
#tareas-overlay.show{display:flex;}
.tar-wrap{width:100%;max-width:440px;margin:0 auto;padding:20px 20px 80px;}
.tar-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.tar-back{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);}
.pt-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin:6px 0;}
.pt-fill{height:100%;background:#c9a84c;border-radius:3px;}
.tarea-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:10px;padding:14px;margin-bottom:10px;}
.tarea-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.tarea-opt{background:rgba(255,255,255,.03);border:.5px solid rgba(221,218,240,.08);border-radius:6px;padding:10px 12px;cursor:pointer;font-size:12px;color:rgba(221,218,240,.55);transition:all .2s;}
.tarea-opt:hover{border-color:rgba(201,168,76,.3);}
.tarea-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.06);color:#dddaf0;}
.tarea-opt.done{border-color:rgba(0,200,150,.3);color:#00c896;background:rgba(0,200,150,.05);pointer-events:none;}
.btn-comp-tarea{background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:12px;font-weight:700;border:none;border-radius:6px;padding:9px 18px;cursor:pointer;}
.btn-comp-tarea:disabled{opacity:.3;cursor:not-allowed;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(7,7,15,.95);border-top:.5px solid rgba(221,218,240,.08);display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(16px);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 10px;border-radius:8px;background:none;border:none;font-family:'Fira Code',monospace;transition:all .2s;}
.nav-btn.active{background:rgba(201,168,76,.08);}
.nav-icon{font-size:19px;line-height:1;}
.nav-label{font-size:9px;color:rgba(221,218,240,.35);letter-spacing:.05em;text-transform:uppercase;}
.nav-btn.active .nav-label,.nav-btn.active .nav-icon{color:#c9a84c;}
</style>
</head>
<body>
<script src="gbt_core.js"></script>
<div class="energia-bar-wrap"><div class="energia-bar-inner"><div class="energia-bar-fill" id="e-bar"></div></div></div>
<div class="energia-label" id="e-label">energía</div>

<div class="page">
  <div class="topbar">
    <div class="back-btn" onclick="navTo('misiones')">←</div>
    <div class="top-title">trabajos</div>
    <div class="top-right">
      <div class="top-stat">GUS <span id="gus-disp">50</span></div>
      <div class="top-stat">nv <span id="lvl-disp">1</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- ══ VIDEOLLAMADA ══ -->
<div id="videollamada">
  <div class="vl-bg">
    <img src="" alt="" class="vl-bg-img" id="vl-bg-img">
    <div class="vl-overlay"></div>
  </div>
  <div class="vl-av-wrap">
    <img src="" alt="" class="vl-av" id="vl-av">
  </div>
  <div class="vl-gi">
    <img src="img/gi_face.jpg" alt="gi" class="vl-gi-av" onerror="this.style.background='rgba(0,229,255,.15)';this.removeAttribute('src')">
    <div class="gi-bubble vl-gi-bubble" id="vl-gi-msg">suerte!</div>
  </div>
  <div class="vl-info">
    <div class="vl-nombre" id="vl-nombre">---</div>
    <div class="vl-cargo" id="vl-cargo">---</div>
    <div class="vl-estado"><div class="vl-dot"></div><span id="vl-estado-txt">en línea</span></div>
  </div>
  <div class="vl-controls">
    <button class="vl-btn vl-btn-end" onclick="colgarLlamada()" title="colgar" style="font-size:14px;font-family:'Fira Code',monospace;font-weight:700;color:#fff;">✕</button>
  </div>
  <div class="vl-preguntas" id="vl-preguntas"></div>

  <!-- PROCESANDO -->
  <div class="vl-procesando" id="vl-procesando">
    <div class="proc-txt">// procesando</div>
    <div class="proc-bar"><div class="proc-fill"></div></div>
  </div>

  <!-- CARTA -->
  <div class="vl-carta" id="vl-carta">
    <img src="" alt="" class="carta-av" id="carta-av">
    <div class="carta-nombre" id="carta-nombre"></div>
    <div class="carta-papel">
      <div class="carta-txt" id="carta-txt"></div>
    </div>
    <button class="btn-carta-ok" id="btn-carta-ok" onclick="aceptarTrabajo()" style="display:none">aceptar trabajo</button>
    <button class="btn-carta-volver" id="btn-carta-volver" onclick="cerrarVideollamada()">volver a trabajos</button>
  </div>
</div>

<!-- ══ LOGRO ══ -->
<div id="logro-overlay">
  <div class="logro-emoji" id="logro-emoji">🎉</div>

function calcN(x){return x<200?1:x<500?2:x<1000?3:x<2000?4:x<4000?5:Math.floor(x/1000)+1;}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

function updateUI(){
  const st=GBT.getStats(); const nv=calcN(st.xp);
  document.getElementById('gus-disp').textContent=st.gus;
  document.getElementById('lvl-disp').textContent=nv;
  const max=GBT.energiaMax(nv); const pct=Math.round(st.energia/max*100);
  const est=GBT.estadoEnergia(st.energia,max);
  const bar=document.getElementById('e-bar'),lbl=document.getElementById('e-label');
  if(bar){bar.style.width=pct+'%';bar.style.background=est.color;}
  if(lbl){lbl.textContent=pct+'% · '+est.label;lbl.style.color=est.color+'aa';}
}

    const trab=ta!==null; const ago=est.label==='agotado';
    const stok=st.tokens<t.tok;
    const disp=!lleno&&!bloq&&!trab&&!ago&&!stok;
    let msg='';
    if(bloq) msg=`// requiere nivel ${t.nivel_min} — estás en nivel ${nv}`;
    else if(sobre) msg=`// tu nivel supera este trabajo — busca uno más exigente`;
    else if(lleno) msg=`// sin cupos disponibles`;
    else if(trab) msg=`// ya estás trabajando — termínalo primero`;
    else if(ago) msg=`// avatar agotado — descansa primero`;
    else if(stok) msg=`// necesitas ${t.tok} tokens para aplicar`;
    html+=`<div class="trabajo-card ${disp?'disponible':'bloqueado'}" onclick="${disp?`abrirEntrevista('${t.id}')`:''}"">
      <div class="tc-top">
        <img src="${t.ent.img}" class="tc-av" onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
        <div><div class="tc-name">${t.icon} ${t.name}</div>
        <div class="tc-sub">entrevista con ${t.ent.nombre}</div>
        <div class="tc-desc">${t.desc}</div></div>
      </div>
      <div class="tc-badges">
        <span class="tc-badge b-dias">${t.dias}${t.dias===1?' día':' días'}</span>
        <span class="tc-badge b-gus">+${t.gus} GUS</span>
        <span class="tc-badge b-xp">+${t.xp} XP</span>
        <span class="tc-badge b-nivel">nv ${t.nivel_min}${t.nivel_max<99?'–'+t.nivel_max:'+'}</span>
        <span class="tc-badge b-tok">${t.tok} tok</span>
      </div>
      <div class="tc-cupos">${t.ocupados}/${t.cupos} cupos
        <div class="cupos-bar"><div class="cupos-fill" style="width:${cpct}%"></div></div>
      </div>
      <div class="tc-prot">✓ protegido de ataques mientras trabajas</div>
      ${msg?`<div class="tc-bloqueo">${msg}</div>`:''}
    </div>`;
  });
  c.innerHTML=html;
}

// ══ ABRIR ENTREVISTA ══
function abrirEntrevista(id){
  const st=GBT.getStats(); const t=TRABAJOS.find(x=>x.id===id);
  if(!t) return;
  if(st.tokens<t.tok){alert('necesitas '+t.tok+' tokens para aplicar');return;}
  GBT.useTokens(t.tok); updateUI();
  tEntrev=t; respsEnt={}; pregAct=0;

  // banco aleatorio 4 preguntas con opciones barajadas
  const banco=BANCO[id]||[];
  pregsSel=shuffle(banco).slice(0,4).map(p=>({
    ...p, opts_s:shuffle(p.opts.map((o,i)=>({o,i})))
  }));

  // setup videollamada
  const e=t.ent;
  document.getElementById('vl-av').src=e.img;
  document.getElementById('vl-bg-img').src=e.img;
  document.getElementById('vl-nombre').textContent=e.nombre;
  document.getElementById('vl-cargo').textContent=e.cargo+' · '+e.empresa;
  document.getElementById('vl-gi-msg').textContent='suerte!';
  document.getElementById('vl-preguntas').style.display='block';
  document.getElementById('vl-procesando').classList.remove('show');
  document.getElementById('vl-carta').classList.remove('show');
  document.getElementById('videollamada').classList.add('show');
  renderPregVL(0);
}

function renderPregVL(idx){
  const p=pregsSel[idx]; const tot=pregsSel.length;
  const dots=pregsSel.map((_,i)=>
    `<div class="preg-dot ${i<idx?'done':i===idx?'active':''}"></div>`).join('');
  document.getElementById('vl-preguntas').innerHTML=`
    <div class="preg-progreso">${dots}</div>
    <div class="preg-num">// pregunta ${idx+1} de ${tot}</div>
    <div class="preg-txt">${p.txt}</div>
    <div class="preg-opts">${p.opts_s.map((item,j)=>
      `<div class="preg-opt" id="vopt-${j}" onclick="selVOpt(${j},${item.i})">${item.o}</div>`).join('')}</div>
    <button class="btn-sig" id="vbtn-sig" onclick="sigVL()" disabled>
      ${idx<tot-1?'siguiente →':'ver resultado'}</button>`;
  pregAct=idx;
}

function selVOpt(j,orig){
  document.querySelectorAll('.preg-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('vopt-'+j).classList.add('sel');
  document.getElementById('vbtn-sig').disabled=false;
  respsEnt[pregAct]=orig;
  // entrevistador "habla"
  document.getElementById('vl-av').classList.add('speaking');
  setTimeout(()=>document.getElementById('vl-av').classList.remove('speaking'),1000);
}

function sigVL(){
  if(pregAct<pregsSel.length-1){ renderPregVL(pregAct+1); }
  else{ mostrarProcesando(); }
}

function colgarLlamada(){ cerrarVideollamada(); }

// ══ PROCESANDO (suspense) ══
function mostrarProcesando(){
  document.getElementById('vl-preguntas').style.display='none';
  document.getElementById('vl-gi-msg').textContent='procesando tu respuesta...';
  document.getElementById('vl-estado-txt').textContent='evaluando';
  const proc=document.getElementById('vl-procesando');
  proc.classList.add('show');
  // reiniciar animación barra
  const fill=proc.querySelector('.proc-fill');
  fill.style.animation='none';
  fill.offsetHeight; // reflow
  fill.style.animation='procAnim 2.5s ease-in-out forwards';
  setTimeout(()=>{ proc.classList.remove('show'); mostrarCarta(); }, 2800);
}

// ══ CARTA ══
function mostrarCarta(){
  const t=tEntrev; const e=t.ent;
  const st=GBT.getStats(); const nv=calcN(st.xp);
  let correctas=0;
  pregsSel.forEach((p,i)=>{ if(respsEnt[i]===p.resp) correctas++; });
  const sobre=nv>t.nivel_max&&t.nivel_max<99;
  const pctE=st.energia/GBT.energiaMax(nv);
  let prob=(correctas/pregsSel.length)*.7+Math.random()*.3;
  if(pctE<.5) prob*=.75;
  const contratado=!sobre&&prob>=.45;
  esContratado=contratado; trabajoConf=t;

  document.getElementById('carta-av').src=e.img;
  document.getElementById('carta-nombre').textContent=e.nombre+' escribe:';
  const avName=GBT.player().avName||'estimado/a';
  let template=sobre?e.carta_sobre:contratado?e.carta_ok:e.carta_no;
  const cartaTxt=template.replace('{n}',avName);

  const okBtn=document.getElementById('btn-carta-ok');
  const volverBtn=document.getElementById('btn-carta-volver');
  okBtn.style.display='none';
  volverBtn.style.display='none';

  document.getElementById('carta-txt').innerHTML='';
  document.getElementById('vl-carta').classList.add('show');
  document.getElementById('vl-estado-txt').textContent=contratado?'oferta enviada':'respuesta enviada';

  // escribir carta
  let i=0;
  const el=document.getElementById('carta-txt');
  function type(){
    if(i<cartaTxt.length){
      el.innerHTML=cartaTxt.substring(0,i+1).replace(/\n/g,'<br>')+'<span class="cursor-carta"></span>';
      i++;
      setTimeout(type,30+Math.random()*15);
    } else {
      el.innerHTML=cartaTxt.replace(/\n/g,'<br>');
      setTimeout(()=>{
        if(contratado){
          okBtn.style.display='block';
        }
        volverBtn.style.display='block';
        // guardar rey treboles
        window._reyQuote = contratado ? t.rey_ok : t.rey_no;
        window._esContratado = contratado;
      },600);
    }
  }
  type();

  GBT.enviar({tipo:'entrevista',trabajo:t.id,usuario:avName,correctas,total:pregsSel.length,aprobado:contratado,nivel:nv,energia_pct:Math.round(pctE*100)});
}

function aceptarTrabajo(){
  cerrarVideollamada();
  // logro
  const t=trabajoConf;
  document.getElementById('logro-emoji').textContent='🎉';
  document.getElementById('logro-nombre-big').textContent='contratado';
  document.getElementById('logro-sub-txt').textContent=t.dias+(t.dias===1?' día':' días')+' de trabajo — +'+t.gus+' GUS al terminar';
  document.getElementById('logro-rewards').innerHTML=`<span class="lr-xp">+${t.xp} XP</span><span class="lr-gus">+${t.gus} GUS (al terminar)</span>`;
  document.getElementById('logro-overlay').classList.add('show');
  playEpic();
}

function mostrarReyTrebol(){
  document.getElementById('logro-overlay').classList.remove('show');
  document.getElementById('rt-quote').textContent=window._reyQuote||'';
  const btnRt=document.getElementById('btn-rt');
  if(window._esContratado){
    btnRt.textContent='iniciar período de prueba';
    btnRt.onclick=()=>{ document.getElementById('rey-trebol-overlay').classList.remove('show'); iniciarPrueba(); };
  } else {
    btnRt.textContent='volver a trabajos';
    btnRt.onclick=()=>{ document.getElementById('rey-trebol-overlay').classList.remove('show'); renderContent(); };
  }
  document.getElementById('rey-trebol-overlay').classList.add('show');
}

// cuando rechazado — mostrar rey directamente desde cerrar carta
function cerrarVideollamada(){
  document.getElementById('videollamada').classList.remove('show');
  if(!esContratado&&trabajoConf){
    window._reyQuote=trabajoConf.rey_no; window._esContratado=false;
    setTimeout(mostrarReyTrebol,300);
  }
}

// ══ PRUEBA ANTI-IA ══
function iniciarPrueba(){
  pruebaIntentos=0; mostrarReto();
}

function mostrarReto(){
  const t=trabajoConf;
  const retos=RETOS[t.id]||RETOS.analista;
  pruebaReto=retos[Math.floor(Math.random()*retos.length)];
  pruebaOptSel=null;
  const optsS=shuffle(pruebaReto.opts.map((o,i)=>({o,i})));
  document.getElementById('prueba-label').textContent='como '+t.name+', tu primera tarea:';
  document.getElementById('prueba-titulo').textContent=pruebaReto.txt;
  document.getElementById('prueba-opts').innerHTML=optsS.map((item,j)=>
    `<div class="prueba-opt" id="popt-${j}" onclick="selPrueba(${j},${item.i})">${item.o}</div>`).join('');
  document.getElementById('btn-confirmar').disabled=true;
  document.getElementById('prueba-intentos').textContent='intento '+(pruebaIntentos+1)+' de 3';

  let seg=30;
  const tel=document.getElementById('prueba-timer');
  tel.textContent=seg; tel.className='prueba-timer';
  clearInterval(pruebaTimer);
  // unlock AudioContext on first interaction
  let _audioUnlocked=false;
  function unlockAudio(){
    if(_audioUnlocked) return;
    try{ const _c=new(window.AudioContext||window.webkitAudioContext)();_c.resume();_audioUnlocked=true; }catch(e){}
  }
  document.addEventListener('touchstart',unlockAudio,{once:true});
  document.addEventListener('click',unlockAudio,{once:true});
  unlockAudio();

  pruebaTimer=setInterval(()=>{
    seg--; tel.textContent=seg<10?'0'+seg:seg;
    if(seg<=10) tel.className='prueba-timer urgente';
    playTick(); // suena en cada segundo siempre
    if(seg<=0){ clearInterval(pruebaTimer); failPrueba(); }
  },1000);
  document.getElementById('prueba-overlay').classList.add('show');
}

let pruebaOrigSel=null;
function selPrueba(j,orig){
  document.querySelectorAll('.prueba-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('popt-'+j).classList.add('sel');
  pruebaOrigSel=orig;
  document.getElementById('btn-confirmar').disabled=false;
}

function confirmarPrueba(){
  clearInterval(pruebaTimer);
  if(pruebaOrigSel===pruebaReto.resp){
    document.getElementById('prueba-overlay').classList.remove('show');
    GBT.iniciarTrabajo(trabajoConf.id);
    trabajoConf=null; renderContent();
  } else { failPrueba(); }
}

function failPrueba(){
  clearInterval(pruebaTimer); pruebaIntentos++;
  document.getElementById('prueba-overlay').classList.remove('show');
  if(pruebaIntentos>=3){
    const t=trabajoConf; const e=t.ent;
    const avName=GBT.player().avName||'estimado/a';
    // despido en videollamada
    document.getElementById('desp-av').src=e.img;
    document.getElementById('desp-bg-img').src=e.img;
    document.getElementById('desp-nombre').textContent=e.nombre;
    document.getElementById('desp-cargo').textContent=e.cargo;
    document.getElementById('desp-carta-av').src=e.img;
    document.getElementById('desp-carta-nombre').textContent=e.nombre+' escribe:';
    const despTxt=e.desp.replace('{n}',avName);
    const despEl=document.getElementById('desp-carta-txt');
    despEl.innerHTML='';
    document.getElementById('despido-overlay').classList.add('show');
    let i=0;
    function typeDesp(){
      if(i<despTxt.length){
        despEl.innerHTML=despTxt.substring(0,i+1).replace(/\n/g,'<br>')+'<span class="cursor-carta"></span>';
        i++; setTimeout(typeDesp,32+Math.random()*16);
      } else { despEl.innerHTML=despTxt.replace(/\n/g,'<br>'); }
    }
    typeDesp();
    trabajoConf=null;
  } else {
    setTimeout(()=>mostrarReto(),400);
  }
}

function cerrarDespido(){ document.getElementById('despido-overlay').classList.remove('show'); renderContent(); }

// ══ TAREAS ══
function abrirTareas(){
  const ta=GBT.getTrabajoActivo(); if(!ta) return;
  const t=TRABAJOS.find(x=>x.id===ta.id);
  const comp=GBT.get('trabajo_tareas_'+ta.id,[]);
  let preg=GBT.get('trabajo_tareas_pregs_'+ta.id,null);
  if(!preg){
    preg=shuffle(BANCO[ta.id]||[]).slice(0,3).map(p=>({...p,opts_s:shuffle(p.opts.map((o,i)=>({o,i})))}));
    GBT.set('trabajo_tareas_pregs_'+ta.id,preg);
  }
  document.getElementById('tar-title').textContent=t.name;
  const now=Date.now(); const pct=Math.min(Math.round((now-ta.inicio_ts)/(ta.fin_ts-ta.inicio_ts)*100),100);
  const ga=Math.round(t.gus*(now-ta.inicio_ts)/(ta.fin_ts-ta.inicio_ts)*.9);
  document.getElementById('progreso-trabajo').innerHTML=`
    <div style="background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-size:10px;color:rgba(221,218,240,.3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">// progreso</div>
      <div class="pt-bar"><div class="pt-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:rgba(221,218,240,.35)">${pct}% · ${comp.length}/${preg.length} tareas · GUS acumulados: <span style="color:#c9a84c;font-weight:700">${ga}</span></div>
    </div>`;
  document.getElementById('tareas-lista').innerHTML=preg.map((p,i)=>{
    const done=comp.includes(i);
    return `<div class="tarea-card">
      <div style="font-size:9px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">// tarea ${i+1}</div>
      <div style="font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:12px;line-height:1.5">${p.txt}</div>
      ${done?`<div class="tarea-opts"><div class="tarea-opt done">✓ completada</div></div>`
        :`<div class="tarea-opts" id="topts-${i}">${p.opts_s.map((item,j)=>
          `<div class="tarea-opt" id="topt-${i}-${j}" onclick="selTareaOpt(${i},${j})">${item.o}</div>`).join('')}
        </div><button class="btn-comp-tarea" id="btn-t-${i}" onclick="compTarea(${i})" disabled>completar</button>`}
    </div>`;
  }).join('');
  document.getElementById('tareas-overlay').classList.add('show');
}

function selTareaOpt(ti,j){
  document.querySelectorAll(`#topts-${ti} .tarea-opt`).forEach(o=>o.classList.remove('sel'));
  document.getElementById(`topt-${ti}-${j}`).classList.add('sel');
  document.getElementById(`btn-t-${ti}`).disabled=false;
}

function compTarea(ti){
  const ta=GBT.getTrabajoActivo(); if(!ta) return;
  const saved=GBT.get('trabajo_tareas_'+ta.id,[]);
  if(!saved.includes(ti)){saved.push(ti);GBT.set('trabajo_tareas_'+ta.id,saved);GBT.addXP(8);}
  abrirTareas();
}
function cerrarTareas(){ document.getElementById('tareas-overlay').classList.remove('show'); }

// ══ ABANDONO ══
function abandonarConAviso(){
  if(!confirm('si avisas recibes GUS proporcional al tiempo trabajado')) return;
  const res=GBT.abandonarTrabajo(true); updateUI(); renderContent(); alert(res.msg);
}
function desertar(){
  if(!confirm('sin avisar pierdes TODO el GUS — ¿seguro?')) return;
  const res=GBT.abandonarTrabajo(false); updateUI(); renderContent(); alert(res.msg);
}

// ══ SONIDOS ══
function playEpic(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    [[55,.22,0,2.5],[82,.15,.1,2.2],[110,.12,.2,2],[165,.09,.3,1.8],[220,.07,.4,1.5],[330,.05,.5,1.2]].forEach(([f,v,t,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(v,now+t+.15);g.gain.exponentialRampToValueAtTime(.001,now+t+d);
      o.connect(g);g.connect(ctx.destination);o.start(now+t);o.stop(now+t+d);
    });
    const buf=ctx.createBuffer(1,ctx.sampleRate*.4,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*.05))*.35;
    const ns=ctx.createBufferSource(),ng=ctx.createGain();ng.gain.value=.6;
    ns.buffer=buf;ns.connect(ng);ng.connect(ctx.destination);ns.start(now);
  }catch(e){}
}
function playTick(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=600;
    g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.05);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.05);
  }catch(e){}
}

function navTo(dest){
  const routes={nodo:'p06_tablero.html',misiones:'p07_misiones.html',duelo:'p08_duelo.html',skill:'p09_skill.html',market:'p10_market.html',universo:'p11_universo.html',trabajos:'p12_trabajos.html'};
  document.body.style.transition='opacity .25s';document.body.style.opacity='0';
  setTimeout(()=>{window.location.href=routes[dest]||'p06_tablero.html';},260);
}

if(_ta&&Date.now()>_ta.fin_ts){GBT.completarTrabajo(_ta);}
