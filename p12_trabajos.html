<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#07070f;color:#dddaf0;font-family:'Fira Code','Courier New',monospace;overflow-x:hidden;}

.energia-bar-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:20;padding:0 16px;pointer-events:none;}
.energia-bar-inner{height:3px;width:100%;background:rgba(255,255,255,.06);}
.energia-bar-fill{height:100%;transition:width .8s,background .5s;}
.energia-label{position:fixed;top:4px;right:20px;font-size:9px;letter-spacing:.06em;z-index:21;font-family:'Fira Code',monospace;}

.page{width:100%;max-width:440px;margin:0 auto;padding-bottom:80px;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:.5px solid rgba(221,218,240,.08);position:sticky;top:0;background:#07070f;z-index:10;}
.back-btn{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);padding:4px 8px 4px 0;}
.back-btn:hover{color:#c9a84c;}
.top-title{font-size:15px;font-weight:700;}
.top-right{margin-left:auto;display:flex;gap:10px;font-size:11px;}
.top-stat{color:rgba(221,218,240,.4);}
.top-stat span{font-weight:700;color:#c9a84c;}

.content{padding:16px;}
.sec-label{font-size:10px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}

/* TRABAJO ACTIVO */
.trabajo-activo-card{background:rgba(0,200,150,.06);border:.5px solid rgba(0,200,150,.3);border-radius:12px;padding:16px;margin-bottom:16px;cursor:pointer;}
.ta-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ta-icon{font-size:22px;}
.ta-name{font-size:14px;font-weight:700;color:#00c896;}
.ta-badge{font-size:9px;color:#07070f;background:#00c896;border-radius:10px;padding:2px 8px;margin-left:4px;}
.ta-prog-wrap{margin-bottom:8px;}
.ta-prog-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.ta-prog-fill{height:100%;background:#00c896;border-radius:3px;transition:width 1s;}
.ta-meta{font-size:11px;color:rgba(221,218,240,.35);margin-top:4px;}
.ta-btns{display:flex;gap:8px;margin-top:12px;}
.btn-ta{flex:1;font-family:'Fira Code',monospace;font-size:11px;padding:8px;border-radius:6px;cursor:pointer;transition:all .2s;}
.btn-avisar{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.25);}
.btn-desertar{background:rgba(255,77,109,.08);color:#ff4d6d;border:.5px solid rgba(255,77,109,.2);}
.btn-tareas{background:rgba(0,200,150,.1);color:#00c896;border:.5px solid rgba(0,200,150,.25);}

/* TRABAJO CARD */
.trabajo-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;transition:all .2s;}
.trabajo-card.disponible{cursor:pointer;}
.trabajo-card.disponible:hover{border-color:rgba(201,168,76,.3);transform:translateY(-1px);}
.trabajo-card.bloqueado{opacity:.5;}
.tc-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.tc-entrevistador{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(221,218,240,.15);flex-shrink:0;}
.tc-info{flex:1;}
.tc-name{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:2px;}
.tc-entrev-nombre{font-size:10px;color:rgba(221,218,240,.35);margin-bottom:4px;}
.tc-desc{font-size:11px;color:rgba(221,218,240,.4);line-height:1.5;}
.tc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tc-badge{font-size:10px;padding:3px 8px;border-radius:4px;}
.b-dias{background:rgba(0,229,255,.08);color:#00e5ff;border:.5px solid rgba(0,229,255,.2);}
.b-gus{background:rgba(201,168,76,.1);color:#c9a84c;border:.5px solid rgba(201,168,76,.2);}
.b-xp{background:rgba(127,106,240,.1);color:#7f6af0;border:.5px solid rgba(127,106,240,.2);}
.b-nivel{background:rgba(255,255,255,.04);color:rgba(221,218,240,.45);border:.5px solid rgba(221,218,240,.1);}
.tc-cupos{font-size:10px;color:rgba(221,218,240,.3);margin-bottom:6px;}
.cupos-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-top:3px;}
.cupos-fill{height:100%;background:#ff4d6d;border-radius:2px;}
.tc-protegido{font-size:10px;color:#00c896;}
.tc-bloqueo-msg{font-size:11px;color:#ff4d6d;margin-top:6px;font-weight:700;}

/* ENTREVISTA OVERLAY */
#entrevista-overlay{position:fixed;inset:0;background:#07070f;z-index:300;display:none;flex-direction:column;overflow-y:auto;}
#entrevista-overlay.show{display:flex;}
.ent-wrap{width:100%;max-width:440px;margin:0 auto;padding:20px 20px 80px;}
.ent-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.ent-back{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);}
.ent-title{font-size:15px;font-weight:700;color:#dddaf0;}

/* PERFIL ENTREVISTADOR */
.ent-perfil{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:14px;margin-bottom:20px;}
.ent-av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,168,76,.3);flex-shrink:0;}
.ent-info{flex:1;}
.ent-nombre{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:2px;}
.ent-cargo{font-size:11px;color:#c9a84c;margin-bottom:2px;}
.ent-empresa{font-size:10px;color:rgba(221,218,240,.35);}
.ent-personalidad{font-size:10px;color:rgba(221,218,240,.25);font-style:italic;margin-top:4px;}

/* GI ROW */
.gi-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;}
.gi-av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(0,229,255,.3);flex-shrink:0;background:rgba(0,229,255,.1);}
.gi-bubble{background:rgba(0,229,255,.06);border:.5px solid rgba(0,229,255,.15);border-radius:0 10px 10px 10px;padding:11px 14px;font-size:13px;color:#dddaf0;line-height:1.6;flex:1;}

/* PREGUNTAS */
.preg-wrap{margin-bottom:20px;}
.preg-progreso{display:flex;gap:4px;margin-bottom:14px;}
.preg-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s;}
.preg-dot.done{background:#c9a84c;}
.preg-dot.active{background:#c9a84c;opacity:.5;}
.preg-num{font-size:9px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.preg-txt{font-size:14px;color:#dddaf0;line-height:1.55;margin-bottom:14px;font-weight:700;}
.preg-opts{display:flex;flex-direction:column;gap:8px;}
.preg-opt{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.1);border-radius:8px;padding:13px 14px;cursor:pointer;font-size:13px;color:rgba(221,218,240,.6);transition:all .2s;line-height:1.4;}
.preg-opt:hover{border-color:rgba(201,168,76,.3);color:#dddaf0;}
.preg-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.08);color:#dddaf0;}
.btn-siguiente{width:100%;background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:14px;cursor:pointer;margin-top:12px;transition:opacity .2s;}
.btn-siguiente:disabled{opacity:.3;cursor:not-allowed;}

/* RESULTADO */
#ent-resultado{display:none;text-align:center;padding:20px 0;}
#ent-resultado.show{display:block;}

/* ENTREVISTADOR REACCIÓN */
.ent-reaccion{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:12px;padding:14px;margin-bottom:20px;text-align:left;}
.ent-reac-av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,168,76,.25);flex-shrink:0;}
.ent-reac-bubble{flex:1;}
.ent-reac-nombre{font-size:11px;color:#c9a84c;margin-bottom:6px;}
.ent-reac-txt{font-size:13px;color:rgba(221,218,240,.7);line-height:1.6;font-style:italic;}

/* REY TRÉBOLES */
.rey-trebol-card{display:flex;gap:12px;align-items:center;background:rgba(0,200,150,.05);border:.5px solid rgba(0,200,150,.2);border-radius:12px;padding:14px;margin-bottom:20px;text-align:left;}
.rey-trebol-img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.rey-trebol-txt{font-size:12px;color:rgba(221,218,240,.55);font-style:italic;line-height:1.6;flex:1;}

.res-titulo{font-size:22px;font-weight:700;margin-bottom:6px;}
.res-titulo.contratado{color:#00c896;}
.res-titulo.rechazado{color:#ff4d6d;}
.res-titulo.sobrecalificado{color:#c9a84c;}
.res-sub{font-size:13px;color:rgba(221,218,240,.4);margin-bottom:20px;line-height:1.6;}
.btn-aceptar-trabajo{width:100%;background:#00c896;color:#07070f;font-family:'Fira Code',monospace;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:14px;cursor:pointer;margin-bottom:10px;}
.btn-cerrar-ent{width:100%;background:rgba(255,255,255,.06);color:rgba(221,218,240,.5);font-family:'Fira Code',monospace;font-size:13px;border:.5px solid rgba(221,218,240,.12);border-radius:8px;padding:12px;cursor:pointer;}

/* TAREAS TRABAJO */
#tareas-overlay{position:fixed;inset:0;background:#07070f;z-index:400;display:none;flex-direction:column;overflow-y:auto;}
#tareas-overlay.show{display:flex;}
.tar-wrap{width:100%;max-width:440px;margin:0 auto;padding:20px 20px 80px;}
.tar-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.tar-back{font-size:20px;cursor:pointer;color:rgba(221,218,240,.4);}
.tar-title{font-size:15px;font-weight:700;}
.tarea-card{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:10px;padding:14px;margin-bottom:10px;}
.tarea-num{font-size:9px;color:rgba(221,218,240,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.tarea-txt{font-size:14px;font-weight:700;color:#dddaf0;margin-bottom:12px;line-height:1.5;}
.tarea-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.tarea-opt{background:rgba(255,255,255,.03);border:.5px solid rgba(221,218,240,.08);border-radius:6px;padding:10px 12px;cursor:pointer;font-size:12px;color:rgba(221,218,240,.55);transition:all .2s;}
.tarea-opt:hover{border-color:rgba(201,168,76,.3);color:#dddaf0;}
.tarea-opt.sel{border-color:#c9a84c;background:rgba(201,168,76,.06);color:#dddaf0;}
.tarea-opt.completada{border-color:rgba(0,200,150,.3);color:#00c896;background:rgba(0,200,150,.05);pointer-events:none;}
.btn-completar-tarea{background:#c9a84c;color:#07070f;font-family:'Fira Code',monospace;font-size:13px;font-weight:700;border:none;border-radius:6px;padding:10px 20px;cursor:pointer;}
.btn-completar-tarea:disabled{opacity:.3;cursor:not-allowed;}
.progreso-trabajo{background:rgba(255,255,255,.04);border:.5px solid rgba(221,218,240,.08);border-radius:10px;padding:14px;margin-bottom:14px;}
.pt-label{font-size:10px;color:rgba(221,218,240,.3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.pt-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.pt-fill{height:100%;background:#c9a84c;border-radius:3px;transition:width .5s;}
.pt-meta{font-size:11px;color:rgba(221,218,240,.35);}
.pt-gus-acum{font-size:13px;color:#c9a84c;font-weight:700;margin-top:4px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(7,7,15,.95);border-top:.5px solid rgba(221,218,240,.08);display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(16px);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 10px;border-radius:8px;background:none;border:none;font-family:'Fira Code',monospace;transition:all .2s;}
.nav-btn.active{background:rgba(201,168,76,.08);}
.nav-icon{font-size:19px;line-height:1;}
.nav-label{font-size:9px;color:rgba(221,218,240,.35);letter-spacing:.05em;text-transform:uppercase;}
.nav-btn.active .nav-label,.nav-btn.active .nav-icon{color:#c9a84c;}
</style>
</head>
<body>

      {txt:'tu primer diseño es rechazado. ¿cuál es tu reacción?',opts:['me enojo — el cliente no entiende','pregunto exactamente qué no funcionó y propongo nueva dirección','acepto sin entender y repito','abandono el proyecto'],resp:1},
      {txt:'¿cómo sabes si una skin tiene valor real para los jugadores?',opts:['si a ti te gusta','si genera reacción en los primeros 10 segundos','si tardaste mucho en hacerla','si tiene muchos colores'],resp:1},
      {txt:'un jugador nivel 1 quiere comprar tu skin nivel 5. ¿qué le dices?',opts:['no puede — punto','le explico qué logros necesita y lo motivo a seguir','le vendo igual — el GUS es el GUS','lo ignoro'],resp:1},
    ],
    rey_ok:'la mejor skin es la que no necesita explicación — eso es lo que buscamos',
    rey_no:'el ojo creativo se afina — no te rindas, vuelve cuando hayas visto más',
  },
  {
    id:'emprender',
    name:'¡a emprender!',
    icon:'🚀',
    desc:'lanza tu primer proyecto — define el problema, valida la idea, prepara el pitch y preséntalo',
    nivel_min:4,
    nivel_max:99,
    duracion_dias:5,
    gus_base:120,
    xp_bonus:160,
    cupos_total:3,
    cupos_ocupados:1,
    umbral:4,
    entrevistador:{
      nombre:'Ana, Diego y Valeria',
      cargo:'panel de evaluación',
      empresa:'GI Force',
      img:'img/entrevistador_ana.jpg',
      personalidad:'tres perspectivas — datos, comunidad y creatividad',
      reaccion_ok:['los tres coincidimos — tiene visión','esto es diferente — hay algo real aquí','el panel raramente coincide — hoy sí'],
      reaccion_no:['el panel vio potencial pero falta estructura','buena energía — el proyecto necesita más claridad todavía'],
      reaccion_sobre:['con ese nivel ya deberías estar mentoreando a otros emprendedores — ¿seguro que quieres este trabajo?'],
    },
    tareas:[
      {txt:'¿cuál es el primer paso para validar una idea de negocio?',opts:['diseñar el logo','hablar con 5 personas que tendrían el problema','calcular cuánto dinero vas a ganar','buscar inversores'],resp:1},
      {txt:'tu primer prototipo es feo y básico. ¿lo muestras igual?',opts:['no — espero a que esté perfecto','sí — el feedback temprano vale más que la perfección','lo muestro solo a amigos cercanos','lo describo con palabras sin mostrarlo'],resp:0},
      {txt:'alguien te dice "no pagaría por eso". ¿cómo lo usas?',opts:['lo ignoro — no entiende la visión','pregunto por qué y qué sí pagaría','busco otro mercado que sí pague','abandono la idea'],resp:1},
      {txt:'¿qué hace que un pitch de 60 segundos funcione?',opts:['que tenga muchas diapositivas','que el problema sea claro antes de hablar de la solución','que uses términos técnicos avanzados','que dure exactamente 60 segundos'],resp:1},
      {txt:'tu startup necesita su primer cliente. ¿dónde lo buscas?',opts:['en redes sociales con publicidad pagada','entre personas que ya tienen el problema que resuelves','en ferias de emprendimiento','esperando que lleguen solos'],resp:1},
    ],
    rey_ok:'emprender es caer bien parado — y tú ya sabes cómo pararte',
    rey_no:'cada intento fallido es un capítulo del libro que vas a escribir — sigue',
  },
];

// ── ESTADO ──
let trabajoEntrevistando = null;
let respuestasEnt = {};
let pregActual = 0;
let tareaActualIdx = 0;

function calcNivel(x){return x<200?1:x<500?2:x<1000?3:x<2000?4:x<4000?5:Math.floor(x/1000)+1;}

function updateUI(){
  const st = GBT.getStats();
  const nivel = calcNivel(st.xp);
  document.getElementById('gus-disp').textContent = st.gus;
  document.getElementById('lvl-disp').textContent = nivel;
  const max = GBT.energiaMax(nivel);
  const pct = Math.round(st.energia/max*100);
  const estado = GBT.estadoEnergia(st.energia, max);
  const bar = document.getElementById('e-bar'), lbl = document.getElementById('e-label');
  if(bar){bar.style.width=pct+'%';bar.style.background=estado.color;}
  if(lbl){lbl.textContent=pct+'% · '+estado.label;lbl.style.color=estado.color+'aa';}
}

function renderContent(){
  const c = document.getElementById('content');
  const st = GBT.getStats();
  const nivel = calcNivel(st.xp);
  const energia = st.energia;
  const max = GBT.energiaMax(nivel);
  const estado = GBT.estadoEnergia(energia, max);
  const trabajoActivo = GBT.getTrabajoActivo();
  let html = '';

  // TRABAJO ACTIVO
  if(trabajoActivo){
    const t = TRABAJOS.find(x=>x.id===trabajoActivo.id);
    const ahora = Date.now();
    const total = trabajoActivo.fin_ts - trabajoActivo.inicio_ts;
    const transcurrido = Math.min(ahora - trabajoActivo.inicio_ts, total);
    const pct = Math.round(transcurrido/total*100);
    const horasR = Math.max(0, Math.round((trabajoActivo.fin_ts-ahora)/3600000));
    const gusAcum = Math.round((t.gus_base * transcurrido/total) * 0.9);

    html += `<div class="sec-label">// en progreso</div>
    <div class="trabajo-activo-card">
      <div class="ta-header">
        <div class="ta-icon">${t.icon}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#00c896;">${t.name}</div>
          <div style="font-size:10px;color:rgba(221,218,240,.35);">protegido de ataques mientras trabajas</div>
        </div>
        <span class="ta-badge">activo</span>
      </div>
      <div class="ta-prog-wrap">
        <div class="ta-prog-bar"><div class="ta-prog-fill" style="width:${pct}%"></div></div>
        <div class="ta-meta">${pct}% · ${horasR}h restantes · acumulado: ${gusAcum} GUS</div>
      </div>
      <div class="ta-btns">
        <button class="btn-ta btn-tareas" onclick="abrirTareas()">ver tareas</button>
        <button class="btn-ta btn-avisar" onclick="abandonarConAviso()">avisar y salir</button>
        <button class="btn-ta btn-desertar" onclick="desertar()">salir sin avisar</button>
      </div>
    </div>`;
  }

  html += `<div class="sec-label">// trabajos disponibles</div>`;

  TRABAJOS.forEach(t=>{
    const cuposPct = Math.round(t.cupos_ocupados/t.cupos_total*100);
    const lleno = t.cupos_ocupados >= t.cupos_total;
    const bloqNivel = nivel < t.nivel_min;
    const sobrecalificado = nivel > t.nivel_max && t.nivel_max < 99;
    const trabajando = trabajoActivo !== null;
    const sinEnergia = estado.label === 'agotado';
    const disponible = !lleno && !bloqNivel && !trabajando && !sinEnergia;
    const yaCompletado = GBT.get('trabajo_completado_'+t.id, false);

    let bloqueoMsg = '';
    if(bloqNivel) bloqueoMsg = `// requiere nivel ${t.nivel_min} — estás en nivel ${nivel}`;
    else if(lleno) bloqueoMsg = `// no hay cupos disponibles ahora`;
    else if(trabajando) bloqueoMsg = `// ya estás en un trabajo — termínalo primero`;
    else if(sinEnergia) bloqueoMsg = `// tu avatar está agotado — descansa primero`;

    html += `<div class="trabajo-card ${disponible?'disponible':'bloqueado'}"
      onclick="${disponible?`abrirEntrevista('${t.id}')`:''}"
    >
      <div class="tc-top">
        <img src="${t.entrevistador.img}" alt="${t.entrevistador.nombre}" class="tc-entrevistador"
          onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
        <div class="tc-info">
          <div class="tc-name">${t.icon} ${t.name}${yaCompletado?' <span style="font-size:10px;color:#00c896;">✓ completado</span>':''}</div>
          <div class="tc-entrev-nombre">entrevista con ${t.entrevistador.nombre}</div>
          <div class="tc-desc">${t.desc}</div>
        </div>
      </div>
      <div class="tc-badges">
        <span class="tc-badge b-dias">${t.duracion_dias} ${t.duracion_dias===1?'día':'días'}</span>
        <span class="tc-badge b-gus">+${t.gus_base} GUS</span>
        <span class="tc-badge b-xp">+${t.xp_bonus} XP</span>
        <span class="tc-badge b-nivel">nv ${t.nivel_min}${t.nivel_max<99?'–'+t.nivel_max:'+'}</span>
      </div>
      <div class="tc-cupos">
        ${t.cupos_ocupados}/${t.cupos_total} cupos ocupados
        <div class="cupos-bar"><div class="cupos-fill" style="width:${cuposPct}%"></div></div>
      </div>
      <div class="tc-protegido">✓ protegido de ataques mientras trabajas</div>
      ${bloqueoMsg?`<div class="tc-bloqueo-msg">${bloqueoMsg}</div>`:''}
    </div>`;
  });

  c.innerHTML = html;
}

// ── ENTREVISTA ──
function abrirEntrevista(id){
  trabajoEntrevistando = TRABAJOS.find(t=>t.id===id);
  if(!trabajoEntrevistando) return;
  respuestasEnt = {}; pregActual = 0;

  const t = trabajoEntrevistando;
  const e = t.entrevistador;

  document.getElementById('ent-title').textContent = 'entrevista · '+t.name;
  document.getElementById('ent-perfil').innerHTML = `
    <img src="${e.img}" alt="${e.nombre}" class="ent-av" onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
    <div class="ent-info">
      <div class="ent-nombre">${e.nombre}</div>
      <div class="ent-cargo">${e.cargo}</div>
      <div class="ent-empresa">${e.empresa}</div>
      <div class="ent-personalidad">${e.personalidad}</div>
    </div>
  `;
  document.getElementById('gi-intro-txt').textContent =
    'prepárate — no hay respuestas correctas o incorrectas, solo formas de ser — ' +
    t.umbral+' de '+t.preguntas.length+' respuestas deciden si '+e.nombre.split(' ')[0]+' te contrata';

  document.getElementById('ent-resultado').classList.remove('show');
  document.getElementById('ent-preguntas').style.display = 'block';
  renderPregunta(0);
  document.getElementById('entrevista-overlay').classList.add('show');
}

function renderPregunta(idx){
  const t = trabajoEntrevistando;
  const p = t.preguntas[idx];
  const total = t.preguntas.length;

  const dots = t.preguntas.map((_,i)=>
    `<div class="preg-dot ${i<idx?'done':i===idx?'active':''}"></div>`
  ).join('');

  document.getElementById('ent-preguntas').innerHTML = `
    <div class="preg-wrap">
      <div class="preg-progreso">${dots}</div>
      <div class="preg-num">// pregunta ${idx+1} de ${total}</div>
      <div class="preg-txt">${p.txt}</div>
      <div class="preg-opts">
        ${p.opts.map((o,i)=>`
          <div class="preg-opt" id="opt-${i}" onclick="selOpt(${i})">${o}</div>
        `).join('')}
      </div>
    </div>
    <button class="btn-siguiente" id="btn-sig" onclick="siguiente()" disabled>
      ${idx<total-1?'siguiente →':'ver resultado'}
    </button>
  `;
  pregActual = idx;
}

function selOpt(i){
  document.querySelectorAll('.preg-opt').forEach(o=>o.classList.remove('sel'));
  document.getElementById('opt-'+i).classList.add('sel');
  document.getElementById('btn-sig').disabled = false;
  respuestasEnt[pregActual] = i;
}

function siguiente(){
  const t = trabajoEntrevistando;
  if(pregActual < t.preguntas.length-1){
    renderPregunta(pregActual+1);
  } else {
    mostrarResultado();
  }
}

function mostrarResultado(){
  const t = trabajoEntrevistando;
  const e = t.entrevistador;
  const st = GBT.getStats();
  const nivel = calcNivel(st.xp);
  const energia = st.energia;
  const max = GBT.energiaMax(nivel);
  const pctEnergia = energia/max;

  // contar respuestas correctas
  let correctas = 0;
  t.preguntas.forEach((p,i)=>{ if(respuestasEnt[i]===p.resp) correctas++; });

  // sobrecalificado
  const sobrecalificado = nivel > t.nivel_max && t.nivel_max < 99;

  // factor azar + energía + nivel
  let prob = (correctas/t.preguntas.length) * 0.7 + Math.random() * 0.3;
  if(pctEnergia < 0.5) prob *= 0.75; // energía baja penaliza
  const contratado = !sobrecalificado && prob >= 0.45;

  document.getElementById('ent-preguntas').style.display = 'none';

  // reacción entrevistador
  let reaccionArr, reaccionExtra = '';
  if(sobrecalificado){
    reaccionArr = e.reaccion_sobre;
  } else if(contratado){
    reaccionArr = e.reaccion_ok;
    if(pctEnergia < 0.5) reaccionExtra = ' — aunque noto que no tienes mucha energía hoy...';
  } else {
    reaccionArr = e.reaccion_no;
    if(pctEnergia < 0.5) reaccionExtra = ' — y con poca energía encima, difícil convencer';
  }
  const reaccionTxt = reaccionArr[Math.floor(Math.random()*reaccionArr.length)] + reaccionExtra;

  document.getElementById('ent-reaccion').innerHTML = `
    <img src="${e.img}" alt="${e.nombre}" class="ent-reac-av" onerror="this.style.background='rgba(201,168,76,.15)';this.removeAttribute('src')">
    <div class="ent-reac-bubble">
      <div class="ent-reac-nombre">${e.nombre}</div>
      <div class="ent-reac-txt">"${reaccionTxt}"</div>
    </div>
  `;

  // rey de tréboles
  const reyTxt = contratado ? t.rey_ok : t.rey_no;
  document.getElementById('rey-trebol-txt').textContent = reyTxt;

  // resultado
  const tituloEl = document.getElementById('res-titulo');
  const subEl = document.getElementById('res-sub');
  const btnAceptar = document.getElementById('btn-aceptar-trabajo');

  if(sobrecalificado){
    tituloEl.className = 'res-titulo sobrecalificado';
    tituloEl.textContent = 'hay algo mejor para ti';
    subEl.textContent = 'tu nivel supera lo que este trabajo ofrece — busca los trabajos de nivel superior';
    btnAceptar.style.display = 'none';
  } else if(contratado){
    tituloEl.className = 'res-titulo contratado';
    tituloEl.textContent = 'contratado';
    subEl.textContent = `${t.duracion_dias} ${t.duracion_dias===1?'día':'días'} de trabajo — +${t.gus_base} GUS al terminar — protegido de ataques`;
    btnAceptar.style.display = 'block';
  } else {
    tituloEl.className = 'res-titulo rechazado';
    tituloEl.textContent = 'no esta vez';
    subEl.textContent = 'puedes intentarlo de nuevo cuando estés listo — el trabajo sigue disponible';
    btnAceptar.style.display = 'none';
  }

  document.getElementById('ent-resultado').classList.add('show');

  // enviar a sheets
  GBT.enviar({
    tipo:'entrevista',
    trabajo:t.id,
    usuario:GBT.player().avName||'',
    correctas,
    total:t.preguntas.length,
    aprobado:contratado,
    nivel,
    energia_pct:Math.round(pctEnergia*100),
  });
}

function confirmarTrabajo(){
  if(!trabajoEntrevistando) return;
  GBT.iniciarTrabajo(trabajoEntrevistando.id);
  cerrarEntrevista();
  renderContent();
}

function cerrarEntrevista(){
  document.getElementById('entrevista-overlay').classList.remove('show');
  renderContent();
}

// ── TAREAS DEL TRABAJO ──
function abrirTareas(){
  const ta = GBT.getTrabajoActivo();
  if(!ta) return;
  const t = TRABAJOS.find(x=>x.id===ta.id);
  const tareasCompletadas = GBT.get('trabajo_tareas_'+ta.id, []);
  const total = t.tareas.length;
  const completadas = tareasCompletadas.length;

  document.getElementById('tar-title').textContent = t.name;

  // progreso
  const ahora = Date.now();
  const pctTiempo = Math.min(Math.round((ahora-ta.inicio_ts)/(ta.fin_ts-ta.inicio_ts)*100),100);
  const gusAcum = Math.round(t.gus_base * (ahora-ta.inicio_ts)/(ta.fin_ts-ta.inicio_ts) * 0.9);
  document.getElementById('progreso-trabajo').innerHTML = `
    <div class="pt-label">// progreso del trabajo</div>
    <div class="pt-bar"><div class="pt-fill" style="width:${pctTiempo}%"></div></div>
    <div class="pt-meta">${pctTiempo}% del tiempo · ${completadas}/${total} tareas completadas</div>
    <div class="pt-gus-acum">GUS acumulados: ${gusAcum}</div>
  `;

  // tareas
  const lista = document.getElementById('tareas-lista');
  lista.innerHTML = t.tareas.map((tarea,i)=>{
    const done = tareasCompletadas.includes(i);
    return `<div class="tarea-card">
      <div class="tarea-num">// tarea ${i+1} de ${total}</div>
      <div class="tarea-txt">${tarea.txt}</div>
      ${done
        ? `<div class="tarea-opts"><div class="tarea-opt completada">✓ completada</div></div>`
        : `<div class="tarea-opts" id="tarea-opts-${i}">
            ${tarea.opts.map((o,j)=>`<div class="tarea-opt" id="topt-${i}-${j}" onclick="selTareaOpt(${i},${j})">${o}</div>`).join('')}
          </div>
          <button class="btn-completar-tarea" id="btn-tarea-${i}" onclick="completarTarea(${i})" disabled>completar esta tarea</button>`
      }
    </div>`;
  }).join('');

  document.getElementById('tareas-overlay').classList.add('show');
}

function selTareaOpt(tareaIdx, optIdx){
  document.querySelectorAll(`#tarea-opts-${tareaIdx} .tarea-opt`).forEach(o=>o.classList.remove('sel'));
  document.getElementById(`topt-${tareaIdx}-${optIdx}`).classList.add('sel');
  document.getElementById(`btn-tarea-${tareaIdx}`).disabled = false;
}

function completarTarea(tareaIdx){
  const ta = GBT.getTrabajoActivo();
  if(!ta) return;
  const saved = GBT.get('trabajo_tareas_'+ta.id, []);
  if(!saved.includes(tareaIdx)){
    saved.push(tareaIdx);
    GBT.set('trabajo_tareas_'+ta.id, saved);
    GBT.addXP(8); // pequeño bonus por tarea
  }
  abrirTareas(); // re-render
}

function cerrarTareas(){
  document.getElementById('tareas-overlay').classList.remove('show');
}

// ── ABANDONO ──
function abandonarConAviso(){
  if(!confirm('si avisas, recibes el GUS proporcional al tiempo trabajado')) return;
  const res = GBT.abandonarTrabajo(true);
  updateUI(); renderContent();
  alert(res.msg);
}

function desertar(){
  if(!confirm('si sales sin avisar pierdes TODO el GUS acumulado — ¿seguro?')) return;
  const res = GBT.abandonarTrabajo(false);
  updateUI(); renderContent();
  alert(res.msg);
}

// ── NAV ──
function navTo(dest){
  const routes={nodo:'p06_tablero.html',misiones:'p07_misiones.html',duelo:'p08_duelo.html',skill:'p09_skill.html',market:'p10_market.html',universo:'p11_universo.html',trabajos:'p12_trabajos.html'};
  document.body.style.transition='opacity .25s';document.body.style.opacity='0';
  setTimeout(()=>{ window.location.href=routes[dest]||'p06_tablero.html'; },260);
}

// ── INIT ──
updateUI();
renderContent();
</script>
